<!DOCTYPE html>
<html lang="en" data-accent="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forefront</title>
  <meta name="description" content="Keep what matters in front of you.">
  <meta name="color-scheme" content="light dark">

  <!-- The theme, applied before the first paint.

       Every other script in this file is a deferred classic script, and this
       one deliberately is not. Deferred scripts run after the document is
       parsed, which is late enough for the browser to have painted a white
       page — so a dark-mode user opening their start page twenty times a day
       would get twenty white flashes. There is no way to fix that from inside
       the boot sequence; it has to happen here.

       js/theme.js is the authority on the theme and duplicates this logic.
       Keeping these eight lines in step with it is the price of no flash. The
       key below is C.LS_THEME_KEY in js/constants.js. -->
  <script>
    (function () {
      var pref = 'system';
      try {
        var stored = localStorage.getItem('forefront.theme.v1');
        if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
      } catch (e) { /* Safari refuses storage to file:// pages; follow the system */ }
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-pref', pref);
    })();
  </script>

  <!-- No network requests, ever. No fonts, no analytics, no CDN. Forefront
       works identically offline and on a plane. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- The Forefront mark, inline, so opening index.html from disk does not
       produce a 404 for favicon.ico and no request leaves the machine.

       Same three cards as ui.icon('mark') and assets/forefront-mark.svg,
       reversed out of a filled tile: at 16px on a tab strip a tile holds its
       shape where a bare mark dissolves into the background. The tile colour
       is the slate accent from css/tokens.css — the one place a literal hex
       lives outside that file, because a data: URI cannot read a CSS variable.
       If the palette changes, change it here too. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233f5a7d'/><g transform='translate(16,16) scale(0.74) translate(-16,-16)'><rect x='27' y='10' width='3' height='12' rx='1.25' fill='%23f8fafc' fill-opacity='0.42'/><rect x='20' y='7' width='5' height='18' rx='2' fill='%23f8fafc' fill-opacity='0.66'/><rect x='2' y='4' width='16' height='24' rx='3' fill='%23f8fafc'/></g></svg>">
</head>
<body data-view="focus">

  <!-- Everything is built by script. The one thing worth having in the markup
       is a message for the case where script cannot run at all. -->
  <!-- The page's heading. Visually hidden because Focus View's whole point is
       that it shows three commitments and almost nothing else — but a document
       with no h1 is a document a screen reader user has to guess at. -->
  <h1 class="sr-only">Forefront</h1>

  <main id="app" class="app"></main>

  <noscript>
    <div class="noscript">
      <h1>Forefront</h1>
      <p>Forefront needs JavaScript. It runs entirely in your browser — nothing
         is sent anywhere — but without scripting there is no app to show.</p>
    </div>
  </noscript>

  <!-- Classic deferred scripts in dependency order, deliberately NOT ES
       modules. A script with type=module is fetched with CORS, and a page
       opened from file:// has an opaque origin, so module scripts fail to load
       in Chrome, Edge and Safari the moment you double-click index.html.
       `defer` gives the same ordered, non-blocking execution and works
       everywhere. -->
  <script defer src="js/constants.js"></script>
  <script defer src="js/theme.js"></script>
  <script defer src="js/model.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/dragdrop.js"></script>
  <script defer src="js/focus.js"></script>
  <script defer src="js/board.js"></script>
  <script defer src="js/review.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>

  <!-- If css/ and js/ did not travel with this file, everything above is a
       blank sheet with nothing visibly wrong in it: no error, no console
       message a normal person will look at, just a white page. Copying
       index.html on its own is the obvious thing to try and it fails silently,
       so the file says what happened instead.

       This cannot fire when the folder is intact — FF.app only exists once
       js/app.js has run, and deferred scripts all execute before
       DOMContentLoaded. In the built forefront.html everything is inlined, so
       it never fires there either. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Only the scripts are worth detecting. A missing css/ leaves a working
      // but unstyled app, which is obvious on sight; a missing js/ leaves a
      // blank page, which is not. Chrome also still reports a stylesheet
      // object for a <link> that failed to load, so testing for that would be
      // a check that quietly never fires.
      if (window.FF && window.FF.app) return;

      function line(text, style) {
        var p = document.createElement('p');
        p.textContent = text;
        p.setAttribute('style', 'margin:0 0 14px;' + (style || ''));
        return p;
      }

      var box = document.createElement('div');
      box.setAttribute('style',
        'max-width:34rem;margin:12vh auto;padding:28px 30px;border:1px solid #cad2e0;' +
        'border-radius:8px;background:#fff;color:#1a2436;' +
        'font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;');

      box.appendChild(line('Forefront could not start.',
        'font-size:21px;font-weight:600;margin-bottom:16px;'));
      box.appendChild(line(
        'This file needs the css and js folders that came with it, sitting beside ' +
        'it in the same place. Copying index.html on its own does not bring them along.',
        'color:#465369;'));
      box.appendChild(line(
        'Either copy the whole folder, or use forefront.html — that is the entire ' +
        'application in a single file and needs nothing next to it.',
        'color:#465369;margin-bottom:0;'));

      document.body.replaceChildren(box);
    });
  </script>
</body>
</html>
