<!--
  Forefront — the entire application in one file.

  GENERATED by tools/build-single-file.js. Do not edit this file; edit the
  sources in css/ and js/ and build it again. It is byte-identical to opening
  index.html from the full folder, with the two stylesheets and eleven scripts
  inlined in place.

  No build step is needed to RUN Forefront — the folder works as it is. This
  file exists for machines where you cannot install anything and would rather
  keep one file in a synced folder than a directory of them.

  Everything still runs locally in your browser. It makes no network requests
  of any kind and sends nothing anywhere.
-->
<!DOCTYPE html>
<html lang="en" data-accent="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forefront</title>
  <meta name="description" content="Keep what matters in front of you.">
  <meta name="color-scheme" content="light dark">

  <!-- The theme, applied before the first paint.

       Every other script in this file is a deferred classic script, and this
       one deliberately is not. Deferred scripts run after the document is
       parsed, which is late enough for the browser to have painted a white
       page — so a dark-mode user opening their start page twenty times a day
       would get twenty white flashes. There is no way to fix that from inside
       the boot sequence; it has to happen here.

       js/theme.js is the authority on the theme and duplicates this logic.
       Keeping these eight lines in step with it is the price of no flash. The
       key below is C.LS_THEME_KEY in js/constants.js. -->
  <script>
    (function () {
      var pref = 'system';
      try {
        var stored = localStorage.getItem('forefront.theme.v1');
        if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
      } catch (e) { /* Safari refuses storage to file:// pages; follow the system */ }
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: dark)').matches);
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-pref', pref);
    })();
  </script>

/* ===== css/tokens.css ===== */
/**
 * Forefront — design tokens.
 *
 * Every colour, size and spacing value in the application is named here. No
 * component stylesheet contains a literal colour. Dropping in a completely
 * different professional palette should mean editing this file and nothing
 * else.
 *
 * Two themes: light, and the dark block near the foot of this file. Every token
 * that carries colour is defined in both. Nothing else about the app changes —
 * no layout, no type, no hierarchy — so a screenshot of one is the other with
 * the lights off.
 *
 * Contrast: every text token clears WCAG AA (4.5:1) against EVERY surface it
 * can land on — white, the page, the subtle surface, the hover fill, the two
 * meaning washes and all five weekly washes — not merely against white. Worst
 * case of that set, in light:
 *
 *   --text-primary    #172033   14.6:1
 *   --text-secondary  #475569    6.8:1
 *   --text-muted      #55637a    5.5:1
 *   --text-faint      #5f6d80    4.7:1
 *
 * There is deliberately no sub-AA tier. An earlier draft had one, annotated
 * "decoration only, never information", and then used it for dates, counts,
 * hints and a button label — which is how that kind of token always ends up
 * being used. Quietness here comes from size and weight instead.
 *
 * Two themes × five accent families × every surface is several hundred pairs,
 * which is more than anyone will re-check by hand after nudging one hex, so it
 * is checked mechanically:  node tools/check-contrast.js
 */

:root {
  /* Tells the browser to render form controls, scrollbars and the <dialog>
     backdrop to match. Without it, dark mode has light scrollbars. */
  color-scheme: light;

  /* ---- Surfaces ---------------------------------------------------- */
  --bg-page:           #eef1f7;
  --bg-surface:        #ffffff;
  --bg-surface-subtle: #e6ebf3;
  --bg-overlay:        rgba(20, 28, 45, 0.30);

  /* The fill under a hovered button, count or menu row. Separate from
     --bg-surface-subtle, which it matches exactly here, because the two want
     opposite things in dark: a recessed panel goes darker, a hover goes
     lighter. Sharing one token made hovering a card's menu row dim it. */
  --bg-hover:          #e2e8f2;

  /* ---- Text -------------------------------------------------------- */
  --text-primary:   #1a2436;
  --text-secondary: #465369;
  --text-muted:     #545f75;
  --text-faint:     #5b677d;
  --text-inverse:   #ffffff;

  /* ---- Accents ----------------------------------------------------- *
   * Overridden per week by the [data-accent] blocks at the foot of this
   * file. Only these four move; everything above stays fixed so that
   * contrast and hierarchy never change with the week.                  */
  --accent-primary:   #3d5a80;
  --accent-strong:    #2d4562;
  --accent-secondary: #6a4a58;
  --focus-wash:       #f2f5fb;

  /* ---- Lines and depth --------------------------------------------- */
  --border-subtle:  #dee4ef;
  --border-muted:   #cad2e0;
  --border-strong:  #aab4c6;

  /* The soft halo on a focused text field. Kept out of the weekly rotation:
     it is three translucent pixels and nobody will ever notice it change hue,
     but every family would need a value and one of them would drift. */
  --ring:           rgba(61, 90, 128, 0.16);
  --shadow-card:    0 1px 2px rgba(20, 28, 45, 0.06);
  --shadow-raised:  0 2px 5px rgba(20, 28, 45, 0.08);
  --shadow-drag:    0 10px 26px rgba(20, 28, 45, 0.18);
  --shadow-dialog:  0 18px 48px rgba(20, 28, 45, 0.22);

  /* ---- Meaning ----------------------------------------------------- */
  --danger:      #97303c;
  --danger-wash: #fbf2f3;
  --ok:          #2c6a51;
  --warn:        #825c19;
  --warn-wash:   #fbf6ed;

  /* ---- Type -------------------------------------------------------- *
   * A system stack. Segoe UI on Windows 11, SF on macOS. No web fonts,
   * so nothing to download and nothing to fail offline.                 */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
             "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --size-xs:  0.6875rem;   /* 11px — ages, counts             */
  --size-sm:  0.8125rem;   /* 13px — secondary labels         */
  --size-md:  0.9375rem;   /* 15px — card titles, body        */
  --size-lg:  1.0625rem;   /* 17px — lane headings            */
  --size-input: 1.25rem;   /* 20px — Quick Capture, still note-sized  */
  --size-xl:  1.5rem;      /* 24px — commitments              */
  --size-2xl: 1.875rem;    /* 30px — commitments, roomy       */

  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semi:   600;

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --tracking-wide: 0.08em;
  --tracking-wider: 0.14em;

  /* ---- Space ------------------------------------------------------- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.5rem;
  --space-6: 2rem;
  --space-7: 3rem;
  --space-8: 4.5rem;

  --radius-sm: 3px;
  --radius-md: 5px;
  --radius-lg: 8px;

  /* ---- Board geometry ---------------------------------------------- */
  --lane-base-width: 17.5rem;
  --lane-gap: var(--space-4);
  --board-max: 96rem;
  --focus-max: 62rem;
  --focus-aside: 15.5rem;

  /* ---- Motion ------------------------------------------------------ */
  --ease: cubic-bezier(0.2, 0, 0.2, 1);
  --dur-fast: 90ms;
  --dur-normal: 160ms;
  --dur-view: 220ms;
}

/**
 * Weekly accent families.
 *
 * One is chosen from the calendar week number, so Forefront looks very slightly
 * different on Monday than it did the Monday before, and identical all week on
 * every machine. Nothing moves and no text changes contrast — only the accent
 * hue and the wash behind Focus. It is enough to stop the page becoming
 * wallpaper and not enough to notice as a "theme".
 *
 * All five are cool — blue, teal-blue, indigo, grey-blue, violet-grey. Two of
 * them used to be maroon and burgundy, on the theory that warmth added
 * variety; what it actually added was one week in five that felt like a
 * different, slightly agitated application. Variety inside a narrow, calm
 * range is the point. If a family ever needs replacing, replace it with
 * another cool one.
 *
 * Turn it off with WEEKLY_ACCENT_ROTATION in js/constants.js.
 */

[data-accent="slate"] {
  --accent-primary:   #3d5a80;
  --accent-strong:    #2d4562;
  --accent-secondary: #6a4a58;
  --focus-wash:       #f2f5fb;
}

[data-accent="steel"] {
  --accent-primary:   #345f79;
  --accent-strong:    #264858;
  --accent-secondary: #6a4a58;
  --focus-wash:       #eff5f8;
}

[data-accent="navy"] {
  --accent-primary:   #37477a;
  --accent-strong:    #283459;
  --accent-secondary: #644562;
  --focus-wash:       #f1f2fb;
}

[data-accent="stone"] {
  --accent-primary:   #47566c;
  --accent-strong:    #35414f;
  --accent-secondary: #6a4a58;
  --focus-wash:       #f1f3f8;
}

[data-accent="heather"] {
  --accent-primary:   #524a70;
  --accent-strong:    #3d3754;
  --accent-secondary: #644562;
  --focus-wash:       #f4f2fa;
}

/* ==================================================================
   Dark
   ==================================================================

   `data-theme` on <html> always holds the RESOLVED theme — "light" or "dark",
   never "system". js/theme.js resolves the preference, and an inline script in
   index.html sets the attribute before the first paint. That is why there is
   no `@media (prefers-color-scheme: dark)` copy of this block: duplicating a
   palette this size is how the two halves drift apart.

   Three things are genuinely different here, rather than inverted:

   1. Elevation comes from surface lightness, not shadow. A card is LIGHTER
      than the page; on light it is white against grey and lifted by a shadow.
      The shadows below still exist, but they are near-black and doing much
      less work.
   2. --text-inverse is dark. A primary button in dark mode is a light accent
      with dark text on it, which is the only way to keep a filled control
      readable without a fluorescent blue.
   3. Neither end is pure. The page is not #000 and the brightest text is not
      #fff: maximum contrast on a large dark field produces halation, where
      light text visibly bleeds into the background. Roughly 14:1 rather than
      21:1 is more comfortable to read for an hour and still clears AA twice
      over.                                                                   */

:root[data-theme="dark"] {
  color-scheme: dark;

  /* ---- Surfaces ---------------------------------------------------- */
  --bg-page:           #11151d;
  --bg-surface:        #1a1f2a;
  --bg-surface-subtle: #161b24;
  --bg-hover:          #252c3a;
  --bg-overlay:        rgba(4, 6, 11, 0.68);

  /* ---- Text -------------------------------------------------------- */
  --text-primary:   #e6ebf5;
  --text-secondary: #b6c1d3;
  --text-muted:     #a1adc0;
  --text-faint:     #919eb3;
  --text-inverse:   #101520;

  /* ---- Accents ----------------------------------------------------- */
  --accent-primary:   #8aaad4;
  --accent-strong:    #a8c0e2;
  --accent-secondary: #d3a0b0;
  --focus-wash:       #161c28;

  /* ---- Lines and depth --------------------------------------------- */
  --border-subtle:  #242b38;
  --border-muted:   #313949;
  --border-strong:  #4a5568;
  --shadow-card:    0 1px 2px rgba(0, 0, 0, 0.40);
  --shadow-raised:  0 2px 6px rgba(0, 0, 0, 0.46);
  --shadow-drag:    0 12px 30px rgba(0, 0, 0, 0.58);
  --shadow-dialog:  0 20px 54px rgba(0, 0, 0, 0.62);
  --ring:           rgba(138, 170, 214, 0.24);

  /* ---- Meaning ----------------------------------------------------- */
  --danger:      #ee98a4;
  --danger-wash: #29181d;
  --ok:          #79c8a2;
  --warn:        #e0b25f;
  --warn-wash:   #282114;
}

/**
 * The weekly accent families again, in dark.
 *
 * Specificity does the work: [data-accent="x"] is one attribute selector,
 * :root[data-theme="dark"] is two, and :root[data-theme="dark"][data-accent="x"]
 * is three — so the light weekly block never leaks into dark, whatever order
 * the attributes end up in.
 *
 * Same rule as the light set: hue moves, hierarchy does not. Each family's
 * --accent-primary is bright enough to be link text on the darkest surface and
 * to carry dark --text-inverse when it is a button fill, and each --focus-wash
 * is a lift of about one step above --bg-page — felt rather than seen.
 */

:root[data-theme="dark"][data-accent="slate"] {
  --accent-primary:   #8aaad4;
  --accent-strong:    #a8c0e2;
  --accent-secondary: #d3a0b0;
  --focus-wash:       #161c28;
}

:root[data-theme="dark"][data-accent="steel"] {
  --accent-primary:   #7cadc9;
  --accent-strong:    #9cc5db;
  --accent-secondary: #d3a0b0;
  --focus-wash:       #141c22;
}

:root[data-theme="dark"][data-accent="navy"] {
  --accent-primary:   #97a6dd;
  --accent-strong:    #b2bfe9;
  --accent-secondary: #cf9cc2;
  --focus-wash:       #171a2a;
}

:root[data-theme="dark"][data-accent="stone"] {
  --accent-primary:   #a2aec4;
  --accent-strong:    #bcc5d6;
  --accent-secondary: #d3a0b0;
  --focus-wash:       #1a1e26;
}

:root[data-theme="dark"][data-accent="heather"] {
  --accent-primary:   #a9a3c6;
  --accent-strong:    #c2bdda;
  --accent-secondary: #cf9cc2;
  --focus-wash:       #1b1924;
}

  <style>
/* ===== css/styles.css ===== */
/**
 * Forefront — components.
 *
 * Every colour here comes from a token in tokens.css. If you find a literal hex
 * value below, it is a bug.
 *
 * The organising idea: hierarchy is made from type size, weight, spacing and
 * muted colour — not from borders, fills or badges. Management and Projects are
 * not given competing brand colours, because two loud lanes are the same as no
 * hierarchy at all.
 */

/* ==================================================================
   Reset and base
   ================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: var(--size-md);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }

button, input, textarea, select { font: inherit; color: inherit; }

kbd {
  font-family: var(--font-ui);
  font-size: 0.9em;
  font-weight: var(--weight-medium);
  padding: 0.1em 0.42em;
  border: 1px solid var(--border-muted);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  color: var(--text-secondary);
  white-space: nowrap;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

/* One focus treatment everywhere, always visible when reached by keyboard. */
:focus-visible {
  outline: 2px solid var(--accent-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
:focus:not(:focus-visible) { outline: none; }

.noscript {
  max-width: 32rem;
  margin: var(--space-8) auto;
  padding: var(--space-5);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}

/* ==================================================================
   Buttons and links
   ================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0.4rem 0.85rem;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-secondary);
  font-size: var(--size-sm);
  font-weight: var(--weight-medium);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:hover { background: transparent; color: var(--text-secondary); }

.btn--primary {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: var(--text-inverse);
}
.btn--primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--text-inverse); }

.btn--quiet { border-color: var(--border-muted); background: var(--bg-surface); }
.btn--quiet:hover { border-color: var(--border-strong); background: var(--bg-surface); }

.btn--ghost {
  border-color: var(--border-muted);
  color: var(--text-secondary);
  padding: 0.5rem 1.15rem;
}
.btn--ghost:hover { border-color: var(--accent-primary); color: var(--accent-primary); background: transparent; }

.btn--faint { color: var(--text-muted); font-weight: var(--weight-normal); }
.btn--faint:hover { color: var(--text-secondary); }

.btn--danger { background: var(--danger); border-color: var(--danger); color: var(--text-inverse); }
.btn--danger:hover { background: var(--danger); filter: brightness(0.92); color: var(--text-inverse); }

.btn--small { padding: 0.25rem 0.6rem; font-size: var(--size-xs); }

/* A square button holding one 16-unit glyph. Used by the theme control, which
   sits in the same row as Data and Shortcuts and must not out-shout them. */
.btn--icon { padding: 0.4rem; }
.btn--icon .icon { width: 1rem; height: 1rem; }

/* Icons inherit colour and are sized by whatever contains them. The two older
   tick call-sites set their own size and still win on specificity. */
.icon {
  display: block;
  flex: none;
  width: 1em;
  height: 1em;
}

.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent-primary);
  font-size: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 0.18em;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--border-strong);
}
.link:hover { text-decoration-color: currentColor; }
.link--small { font-size: var(--size-xs); }
.link--danger { color: var(--danger); }

/* ==================================================================
   Wordmark
   ================================================================== */

/* Sized to be read, not hunted for. This is the only thing on the page that
   says which application you are looking at, and at 11px in --text-muted it
   was quiet enough to disappear — which is the wrong kind of restraint for a
   browser start page sitting in a row of open tabs. */
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--size-sm);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--text-secondary);
}
.wordmark--button {
  padding: 0; border: 0; background: none; cursor: pointer;
}
.wordmark--button:hover { color: var(--accent-primary); }

/* The mark carries the weekly accent while the word stays in secondary text.
   It is the one place the rotation is allowed to be the brightest thing on
   screen — at 20px beside a 13px word, that is identity, not decoration. */
.wordmark__mark {
  width: 1.25rem;
  height: 1.25rem;
  color: var(--accent-primary);
}

/* ==================================================================
   Focus View
   ==================================================================
   The default page. Deliberately mostly empty. The commitments are the
   only thing set at a size you read from across the desk; everything
   else is small, muted and out of the way.                            */

/* The weekly wash sits on the page itself, full width. Painting it on the
   centred column instead leaves a visible rectangle with hard edges. */
body[data-view="focus"] {
  /* The colour is named explicitly: the `background` shorthand resets
     background-color to transparent, which leaves a visible seam where the
     gradient stops and the untinted canvas begins. */
  background: linear-gradient(var(--focus-wash), var(--bg-page) 32rem) no-repeat var(--bg-page);
  background-attachment: fixed;
}

.focus {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: var(--focus-max);
  margin: 0 auto;
  padding: var(--space-6) var(--space-5) var(--space-5);
}

.focus__header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
}

.focus__date {
  font-size: var(--size-sm);
  color: var(--text-muted);
}

/* Deliberately not vertically centred. Centring three short lines in a 1080px
   viewport leaves them adrift in the middle of nowhere; sitting them where the
   eye already lands reads as composed rather than empty. */
.focus__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--focus-aside);
  gap: var(--space-7);
  padding: var(--space-8) 0 var(--space-6);
}

/* The aside stretches to the height of the commitments so its rule runs the
   length of the column rather than stopping under the last chore. */
.focus__aside {
  padding-left: var(--space-6);
  border-left: 1px solid var(--border-subtle);
}

.focus__label {
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: var(--space-5);
}

/* ---- Commitments ---- */

.commitments {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.commitment {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  border-radius: var(--radius-md);
  cursor: default;
}

.commitment__text {
  flex: 1;
  display: flex;
  align-items: baseline;
  gap: 0.3rem;
  min-width: 0;
}

.commitment__title {
  font-size: var(--size-2xl);
  font-weight: var(--weight-normal);
  line-height: var(--leading-tight);
  letter-spacing: -0.011em;
  color: var(--text-primary);
  text-wrap: balance;
  /* A pasted URL is one very long word. Without this it refuses to wrap and
     drags the whole page into horizontal scrolling. */
  overflow-wrap: anywhere;
}

.commitment__age {
  flex-shrink: 0;
  min-width: 2.6rem;
  text-align: right;
  font-size: var(--size-xs);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* The done control sits in the left margin and only resolves on hover or
   keyboard focus, so the resting page is nothing but the commitments. */
/* Hanging in the margin, outside the text column, so the commitments
   themselves line up with the label above them. */
.commitment__done {
  position: absolute;
  left: calc(var(--space-6) * -1);
  top: 0.35em;
  width: 1.4rem;
  height: 1.4rem;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border-muted);
  border-radius: 50%;
  background: var(--bg-surface);
  color: var(--accent-primary);
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--dur-normal) var(--ease),
              border-color var(--dur-fast) var(--ease),
              background var(--dur-fast) var(--ease);
}
.commitment__done svg { width: 0.85rem; height: 0.85rem; }

.commitment:hover .commitment__done,
.commitment:focus-within .commitment__done,
.commitment__done:focus-visible { opacity: 1; }

.commitment__done:hover {
  border-color: var(--accent-primary);
  background: var(--focus-wash);
}

.focus__extra,
.focus__nudge {
  margin-top: var(--space-5);
  font-size: var(--size-sm);
  color: var(--text-muted);
}
.focus__nudge { margin-top: var(--space-2); color: var(--text-faint); }

.focus__empty { padding: var(--space-4) 0; }
.focus__empty-line {
  font-size: var(--size-xl);
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}

/* ---- Quick Capture control ---- */

/* Capture belongs with the commitments — it is the next thing you might do,
   not a footer control. Left edge shared with everything else in the column. */
.focus__capture {
  display: flex;
  padding: var(--space-6) 0 0;
}

/* ---- Just Do It, beside the commitments ----
   Everything here is sized to lose to the commitments on purpose: body text
   against 30px, secondary against primary, a hairline instead of a panel. If
   this column ever starts competing for attention, shrink it — do not grow
   the commitments to match. */

.quick {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.quick__item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  border-radius: var(--radius-sm);
  cursor: default;
}

.quick__title {
  font-size: var(--size-sm);
  line-height: var(--leading-normal);
  color: var(--text-secondary);
  /* A pasted URL is one very long word, and this column is narrow. */
  overflow-wrap: anywhere;
}

/* Hidden until hover or keyboard focus, exactly like a commitment's tick.
   Five permanently visible circles beside three commitments would be five
   things competing with the only three that matter. Space is reserved either
   way so nothing shifts when they appear. */
.quick__done {
  flex: none;
  width: 1rem;
  height: 1rem;
  margin-top: 0.16rem;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border-muted);
  border-radius: 50%;
  background: none;
  color: var(--text-faint);
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--dur-normal) var(--ease), color var(--dur-fast) var(--ease);
}
.quick__done svg { width: 0.6rem; height: 0.6rem; }
.quick__item:hover .quick__done,
.quick__item:focus-within .quick__done { opacity: 1; }
.quick__done:hover { color: var(--accent-primary); border-color: var(--accent-primary); }

.quick__empty {
  font-size: var(--size-sm);
  color: var(--text-faint);
}

.quick__more {
  margin-top: var(--space-4);
  padding: 0;
  border: 0;
  background: none;
  font-size: var(--size-xs);
  color: var(--text-muted);
  cursor: pointer;
}
.quick__more:hover { color: var(--accent-primary); }

.capture-button {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0.55rem 1.1rem;
  border: 1px solid var(--border-muted);
  border-radius: 999px;
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: var(--size-sm);
  cursor: pointer;
  box-shadow: var(--shadow-card);
  transition: border-color var(--dur-fast) var(--ease),
              color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
.capture-button:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  box-shadow: var(--shadow-raised);
}
.capture-button__plus { font-size: 1.05rem; line-height: 1; color: var(--text-muted); }
.capture-button:hover .capture-button__plus { color: var(--accent-primary); }
.capture-button__key {
  margin-left: var(--space-1);
  font-size: var(--size-xs);
  color: var(--text-muted);
}

/* ---- Footer counts ---- */

.focus__footer {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: auto;          /* the counts sit at the foot of the page */
  padding-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}

.counts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

/* Counts are readable but not inviting. They report that a backlog exists;
   they are not meant to pull you into it every morning. */
.count {
  display: inline-flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: 0.2rem 0.5rem;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease);
}
.count:hover { background: var(--bg-hover); }
.count__label { font-size: var(--size-xs); color: var(--text-muted); }
.count__value {
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}
.count--zero .count__value { color: var(--text-faint); font-weight: var(--weight-normal); }

.focus__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* ==================================================================
   Weekly review prompt and indicator
   ================================================================== */

.review-prompt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
  margin-top: var(--space-5);
  padding: var(--space-4) var(--space-5);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-left: 2px solid var(--accent-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}
.review-prompt__title { font-size: var(--size-md); font-weight: var(--weight-semi); }
.review-prompt__sub { font-size: var(--size-sm); color: var(--text-muted); }
.review-prompt__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* What is left after "Later". A word, in muted text, and nothing more. */
.review-indicator {
  margin-left: auto;
  padding: 0.2rem 0.5rem;
  border: 0;
  background: none;
  color: var(--text-faint);
  font-size: var(--size-xs);
  cursor: pointer;
}
.review-indicator:hover { color: var(--accent-primary); }

/* ==================================================================
   Board View
   ================================================================== */

.board {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: var(--space-5) var(--space-5) var(--space-6);
  max-width: var(--board-max);
  margin: 0 auto;
  width: 100%;
}

.board__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding-bottom: var(--space-4);
}
.board__actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

/* ---- Inbox: a strip, not a column ----
   Inbox is a holding pen you empty, not a place work lives. Making it a
   sixth column would quietly turn it into another backlog. */

.inbox {
  margin-bottom: var(--space-5);
  padding: var(--space-3) var(--space-4) var(--space-4);
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}
.inbox--empty { background: transparent; border-style: dashed; }

.inbox__bar {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.inbox__heading {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-secondary);
}
.inbox__count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.inbox__hint { font-size: var(--size-xs); color: var(--text-muted); }

.inbox__list {
  display: flex;
  gap: var(--space-3);
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: var(--space-2);
  min-height: 3.5rem;
  scrollbar-width: thin;
}
.inbox__list > .card { flex: 0 0 16rem; }

/* ---- Lanes ---- */

/* The lane area scrolls as one surface, in both directions.
   `overflow-y: visible` cannot be combined with `overflow-x: auto` — CSS
   computes it to `auto` regardless — so the vertical scroll container exists
   whether or not it is asked for. It is claimed deliberately here: it is what
   makes the sticky lane headings work, and js/dragdrop.js autoscrolls this
   element rather than the window because of it. */
.board__scroller {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding-bottom: var(--space-3);
  scrollbar-width: thin;
  overscroll-behavior: contain;
}

.board__lanes {
  display: flex;
  gap: var(--lane-gap);
  align-items: flex-start;
  min-height: 22rem;
}

/* Width comes from the lane's weight in constants.js. Just Do It is narrower
   and In Progress wider, so a stack of trivial chores cannot out-shout one
   hard piece of work simply by being longer. On a laptop the board scrolls
   sideways rather than crushing the columns to an unreadable width. */
.lane {
  flex: 0 0 calc(var(--lane-base-width) * var(--lane-weight, 1));
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* Sticky, so the lane you are dragging into is still named when a long
   Management column has scrolled its heading off the top. */
.lane__header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: var(--space-3);
  background: var(--bg-page);
}
.lane__title {
  font-size: var(--size-sm);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-secondary);
}
.lane__count {
  font-size: var(--size-xs);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.lane__note {
  margin-left: auto;
  font-size: var(--size-xs);
  color: var(--text-faint);
}
/* Only for a board that arrived over the commitment limit through an import.
   It asks for one specific action, so it is allowed to be the loudest small
   thing on the board — which at 11px is not very loud. */
.lane__note--over { color: var(--warn); font-weight: var(--weight-medium); }

.lane__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 6rem;
  padding-bottom: var(--space-5);
}

.lane__empty {
  padding: var(--space-4) var(--space-3);
  font-size: var(--size-sm);
  color: var(--text-faint);
}
.lane__empty--inbox { padding: var(--space-2) var(--space-1); }

/* In Progress: the one lane that gets deliberate emphasis, because it is
   the one that drives Focus. */
.lane--emphasis .lane__header { border-bottom-color: var(--accent-primary); }
.lane--emphasis .lane__title { color: var(--accent-primary); }
.lane--emphasis .lane__list {
  padding: var(--space-2);
  margin: calc(var(--space-2) * -1);
  border-radius: var(--radius-lg);
  background: var(--focus-wash);
}

/* Just Do It: lighter, narrower, quieter. Not broken — secondary. */
.lane--secondary .lane__title { color: var(--text-muted); }
.lane--secondary .card { padding: var(--space-2) var(--space-3); }
.lane--secondary .card__title { font-size: var(--size-sm); color: var(--text-secondary); }

/* Done: short-term closure, not storage. Muted, but solid — a dashed border
   reads as "unfinished", which is the opposite of what this lane means.
   The title stays at --text-secondary so completed work is still legible. */
.lane--terminal .card {
  background: var(--bg-surface-subtle);
  border-color: var(--border-subtle);
  box-shadow: none;
}
.lane--terminal .card__title { color: var(--text-secondary); }

/* ==================================================================
   Cards
   ================================================================== */

.card {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  padding: var(--space-3);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  cursor: default;
  /* Vertical panning still scrolls the page on a touchscreen; a drag needs a
     press-and-hold, which js/dragdrop.js implements. */
  touch-action: pan-y;
  transition: border-color var(--dur-fast) var(--ease),
              box-shadow var(--dur-fast) var(--ease);
}
.card:hover { border-color: var(--border-muted); box-shadow: var(--shadow-raised); }

.card__body { flex: 1; min-width: 0; }

.card__title {
  font-size: var(--size-md);
  line-height: var(--leading-tight);
  color: var(--text-primary);
  overflow-wrap: anywhere;
}

.card__notes {
  margin-top: var(--space-1);
  font-size: var(--size-xs);
  line-height: var(--leading-normal);
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Age is information, not an alarm. Small and muted, but still AA-legible —
   quiet comes from size and weight, never from unreadable contrast.

   The column keeps its width whatever the string is. Without that, a card
   ageing from "today" to "1d" overnight would reflow its own title, and the
   ages down the right edge of a lane would sit at a different x on every row
   instead of stacking into one register you can read at a glance. */
.card__age {
  flex-shrink: 0;
  min-width: 2.6rem;
  text-align: right;
  font-size: var(--size-xs);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  padding-top: 0.1rem;
}

/* Done reads "yesterday" and "3d ago", which need more room than a lane of
   plain day counts. */
.lane--terminal .card__age { min-width: 4.5rem; }

.card__done,
.card__menu {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text-faint);
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--dur-normal) var(--ease), color var(--dur-fast) var(--ease);
}
.card__done { width: 1.15rem; height: 1.15rem; margin-top: 0.08rem; border: 1px solid var(--border-muted); border-radius: 50%; }
.card__done svg { width: 0.72rem; height: 0.72rem; }
.card__done:hover { color: var(--accent-primary); border-color: var(--accent-primary); }

.card__menu { width: 1.3rem; height: 1.3rem; border-radius: var(--radius-sm); letter-spacing: 0.05em; }
.card__menu:hover { color: var(--text-secondary); background: var(--bg-hover); }

.card:hover .card__done,
.card:hover .card__menu,
.card:focus-within .card__done,
.card:focus-within .card__menu,
.card__done:focus-visible,
.card__menu:focus-visible { opacity: 1; }

/* Where there is no hover — a touchscreen laptop, a tablet — reveal-on-hover
   means never revealed. Show the controls outright instead. */
@media (hover: none) {
  .card__done, .card__menu, .commitment__done, .quick__done { opacity: 1; }
}

/* The top three in In Progress: what Focus will actually show. */
.card--focus { border-left: 2px solid var(--accent-primary); }

/* Marked only during the Prune step of the weekly review. */
.card--stale .card__age {
  color: var(--accent-secondary);
  font-weight: var(--weight-semi);
}

.card--done .card__age { color: var(--text-faint); }

/* ---- Drag states ---- */

body.is-dragging { cursor: grabbing; user-select: none; }
body.is-dragging .card { cursor: grabbing; }

/* The real card, sitting in the slot it would land in. The lanes open up
   around it as you move, so what you see is what you get. */
.card--placeholder {
  opacity: 0.34;
  box-shadow: none;
  border-style: dashed;
}
.card--placeholder .card__done,
.card--placeholder .card__menu { opacity: 0 !important; }

/* The copy that follows the pointer. */
.card--proxy {
  position: fixed;
  top: 0; left: 0;
  z-index: 60;
  margin: 0;
  pointer-events: none;
  box-shadow: var(--shadow-drag);
  border-color: var(--border-strong);
  transform-origin: top left;
  opacity: 0.97;
}
.card--proxy .card__done,
.card--proxy .card__menu { opacity: 0; }

/* ==================================================================
   Review rail
   ================================================================== */

.rail {
  margin-bottom: var(--space-5);
  padding: var(--space-4) var(--space-5);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-left: 2px solid var(--accent-primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}

.rail__main {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-5);
  flex-wrap: wrap;
}

.rail__eyebrow {
  display: flex;
  gap: var(--space-3);
  font-size: var(--size-xs);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: var(--space-1);
}
.rail__progress { font-variant-numeric: tabular-nums; }

.rail__title { font-size: var(--size-lg); font-weight: var(--weight-semi); }
.rail__guide {
  margin-top: var(--space-1);
  font-size: var(--size-sm);
  color: var(--text-secondary);
  max-width: 52ch;
  text-wrap: pretty;
}

.rail__actions { display: flex; align-items: center; gap: var(--space-2); }
.rail__exit {
  margin-left: var(--space-2);
  padding: 0.2rem 0.4rem;
  border: 0; background: none;
  color: var(--text-faint);
  font-size: var(--size-xs);
  cursor: pointer;
}
.rail__exit:hover { color: var(--text-secondary); }

.rail__body {
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border-subtle);
}
.rail__status, .rail__empty, .rail__more {
  font-size: var(--size-sm);
  color: var(--text-muted);
}
.rail__more { margin-top: var(--space-2); font-size: var(--size-xs); }

/* Bounded columns rather than 1fr: stretching three finished items across a
   1920px window leaves each title marooned from its own date. */
.lookback__list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(18rem, 22rem));
  justify-content: start;
  gap: var(--space-1) var(--space-6);
}
.lookback__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  font-size: var(--size-sm);
}
.lookback__title { color: var(--text-secondary); }
.lookback__when { flex-shrink: 0; font-size: var(--size-xs); color: var(--text-faint); }

.commit-list__items { display: flex; flex-direction: column; gap: var(--space-2); counter-reset: commit; }
.commit-list__item {
  display: flex;
  gap: var(--space-3);
  font-size: var(--size-md);
  color: var(--text-primary);
}
.commit-list__item::before {
  counter-increment: commit;
  content: counter(commit);
  color: var(--text-faint);
  font-size: var(--size-xs);
  font-variant-numeric: tabular-nums;
  padding-top: 0.15rem;
}
.commit-list__item--extra { color: var(--text-muted); }

/* ==================================================================
   Dialogs
   ================================================================== */

.dialog {
  padding: 0;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-dialog);
  max-width: min(38rem, calc(100vw - 2rem));
  max-height: calc(100vh - 4rem);
  overflow: auto;
}
.dialog::backdrop { background: var(--bg-overlay); }

.dialog__body { padding: var(--space-5); }
.dialog__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
.dialog__title { font-size: var(--size-lg); font-weight: var(--weight-semi); margin-bottom: var(--space-2); }
.dialog__message { font-size: var(--size-sm); color: var(--text-secondary); margin-bottom: var(--space-4); }

/* What is standing in the way, when In Progress refuses a fourth card. Naming
   them is the difference between a rule and a wall. */
.dialog--limit { width: min(32rem, calc(100vw - 2rem)); }
.limit-list {
  margin: 0 0 var(--space-5);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-surface-subtle);
  border-radius: var(--radius-md);
  counter-reset: limit;
}
.limit-list__item {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  font-size: var(--size-sm);
  color: var(--text-primary);
  counter-increment: limit;
}
.limit-list__item::before {
  content: counter(limit);
  flex: none;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}
.dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-5);
}
.dialog__close {
  padding: 0 var(--space-2);
  border: 0; background: none;
  color: var(--text-muted);
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
}
.dialog__close:hover { color: var(--text-primary); }

/* ---- Quick Capture ----
   Positioned near the top of the viewport rather than dead centre: it is a
   note you jot, not a decision you are being asked to make. */
.dialog--capture {
  width: min(42rem, calc(100vw - 2rem));
  margin-top: 18vh;
  border-radius: var(--radius-lg);
}

.capture { padding: var(--space-4); }
.capture__input {
  width: 100%;
  padding: var(--space-2) var(--space-1);
  border: 0;
  border-bottom: 1px solid var(--border-muted);
  background: none;
  font-size: var(--size-input);
  font-weight: var(--weight-normal);
  line-height: var(--leading-tight);
}
.capture__input:focus { outline: none; border-bottom-color: var(--accent-primary); }
.capture__input::placeholder { color: var(--text-faint); }

.capture__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  margin-top: var(--space-3);
  font-size: var(--size-xs);
  color: var(--text-muted);
}
.capture__hint { display: flex; align-items: center; gap: 0.15rem; color: var(--text-faint); }

/* ---- Edit ---- */

.edit { padding: var(--space-5); }
.edit__title,
.edit__notes {
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border-muted);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
}
.edit__title { font-size: var(--size-lg); margin-bottom: var(--space-3); }
.edit__notes { font-size: var(--size-sm); line-height: var(--leading-normal); resize: vertical; }
.edit__title:focus, .edit__notes:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--ring); }

/* ---- Help ---- */

.help {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-2) var(--space-4);
  align-items: baseline;
  margin-top: var(--space-4);
}
.help dd { font-size: var(--size-sm); color: var(--text-secondary); }
.help__note { margin-top: var(--space-4); font-size: var(--size-xs); color: var(--text-muted); }

/* ==================================================================
   Data panel
   ================================================================== */

.dialog--data { width: min(44rem, calc(100vw - 2rem)); }

.data-panel__section {
  padding-top: var(--space-5);
  margin-top: var(--space-5);
  border-top: 1px solid var(--border-subtle);
}
.data-panel__section:first-of-type { border-top: 0; margin-top: var(--space-3); padding-top: 0; }

.data-panel__heading {
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--space-3);
}
.data-panel__lede {
  font-size: var(--size-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-3);
  text-wrap: pretty;
}
.data-panel__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-3);
}
.data-panel__paste {
  width: 100%;
  margin-top: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--border-muted);
  border-radius: var(--radius-md);
  font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: var(--size-xs);
  line-height: var(--leading-normal);
  resize: vertical;
}
.data-panel__paste:focus { outline: none; border-color: var(--accent-primary); }

.data-line {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  font-size: var(--size-sm);
}
.data-line__label { flex: 0 0 9rem; color: var(--text-muted); font-size: var(--size-xs); }
.data-line__value { color: var(--text-primary); overflow-wrap: anywhere; }
.data-line--ok .data-line__value { color: var(--ok); }
.data-line--warn .data-line__value { color: var(--warn); }
.data-line--bad .data-line__value { color: var(--danger); }
.data-line--muted .data-line__value { color: var(--text-muted); }

.data-note {
  margin: var(--space-2) 0 0;
  padding-left: var(--space-3);
  border-left: 2px solid var(--border-muted);
  font-size: var(--size-xs);
  line-height: var(--leading-normal);
  color: var(--text-muted);
  text-wrap: pretty;
}

.discarded__list { display: flex; flex-direction: column; gap: var(--space-1); }
.discarded__item {
  display: flex;
  align-items: baseline;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  font-size: var(--size-sm);
}
.discarded__title { flex: 1; color: var(--text-secondary); overflow-wrap: anywhere; }
.discarded__when { flex-shrink: 0; font-size: var(--size-xs); color: var(--text-faint); }

/* ---- Import report ---- */

.dialog--report { width: min(40rem, calc(100vw - 2rem)); }
.report__lede { font-size: var(--size-sm); color: var(--text-secondary); margin-bottom: var(--space-4); }
.report__block { margin-top: var(--space-4); }
.report__heading {
  font-size: var(--size-xs);
  font-weight: var(--weight-semi);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.report__list { display: flex; flex-direction: column; gap: var(--space-1); font-size: var(--size-xs); color: var(--text-secondary); }
.report__list li { padding-left: var(--space-3); border-left: 2px solid var(--border-subtle); }
.report__errors .report__list li { border-left-color: var(--danger); }
.report__rejected .report__list li { border-left-color: var(--warn); }
.report__more { margin-top: var(--space-2); font-size: var(--size-xs); color: var(--text-faint); }

/* ==================================================================
   Popup menu
   ================================================================== */

.menu {
  position: fixed;
  z-index: 70;
  min-width: 12rem;
  padding: var(--space-1);
  background: var(--bg-surface);
  border: 1px solid var(--border-muted);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-dialog);
}
.menu__item {
  display: block;
  width: 100%;
  padding: 0.32rem var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
  font-size: var(--size-sm);
  color: var(--text-primary);
  cursor: pointer;
}
.menu__item:hover, .menu__item:focus-visible { background: var(--bg-hover); outline-offset: -2px; }
.menu__item--danger { color: var(--danger); }
.menu__item--danger:hover { background: var(--danger-wash); }

/* Radio rows. The gutter is always there, on every row of such a menu, so the
   labels stay on one vertical line instead of shuffling as the choice moves. */
.menu__item--checkable { display: flex; align-items: center; gap: var(--space-2); }
.menu__check {
  display: flex;
  flex: none;
  width: 0.8rem;
  color: var(--accent-primary);
}
.menu__check .icon { width: 0.8rem; height: 0.8rem; }
.menu__sep { height: 1px; margin: var(--space-1) var(--space-2); background: var(--border-subtle); }
.menu__heading {
  padding: var(--space-2) var(--space-3) var(--space-1);
  font-size: var(--size-xs);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ==================================================================
   Banners and toasts
   ================================================================== */

.banner-host { position: sticky; top: 0; z-index: 50; }

.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  font-size: var(--size-sm);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
.banner__text { flex: 1; text-wrap: pretty; }
.banner__actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
.banner--warn { background: var(--warn-wash); border-bottom-color: var(--warn); color: var(--text-primary); }
.banner--bad  { background: var(--danger-wash); border-bottom-color: var(--danger); color: var(--text-primary); }
.banner__dismiss {
  padding: 0 var(--space-2);
  border: 0; background: none;
  color: var(--text-muted);
  font-size: 1.15rem; line-height: 1;
  cursor: pointer;
}
.banner__dismiss:hover { color: var(--text-primary); }

.toasts {
  position: fixed;
  bottom: var(--space-5);
  left: 50%;
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  pointer-events: none;
}
.toast {
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  background: var(--text-primary);
  color: var(--text-inverse);
  font-size: var(--size-xs);
  box-shadow: var(--shadow-raised);
  animation: toast-in var(--dur-normal) var(--ease);
}
.toast--error { background: var(--danger); }
.toast--ok { background: var(--ok); }
.toast--leaving { opacity: 0; transition: opacity var(--dur-normal) var(--ease); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* ==================================================================
   View transition
   ==================================================================
   A short fade and a few pixels of travel when you switch views.

   Applied by a class that app.js adds only on an actual view change —
   never on the first paint. An animating container is an invisible
   container until the animation runs, and the one thing a browser start
   page must never do is show nothing.                                  */

.view-enter { animation: view-in var(--dur-view) var(--ease); }

@keyframes view-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: none; }
}

/* ==================================================================
   Narrower screens
   ==================================================================
   This is a desktop tool. The board scrolls sideways rather than
   compressing lanes into unreadable slivers; only the chrome adapts.   */

@media (max-width: 60rem) {
  .focus { padding: var(--space-5) var(--space-4); }
  .commitment__title { font-size: var(--size-xl); }
  /* No room in the margin at this width, so the control comes back inside. */
  .commitment { padding-left: var(--space-6); }
  .commitment__done { left: 0; }
  /* Two columns need about 60rem to keep the commitments large. Below that the
     chores go underneath rather than squeezing the thing they must not
     outrank, and the rule turns from a spine into a divider. */
  .focus__body {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-6);
    padding-top: var(--space-6);
  }
  .focus__aside {
    padding-left: 0;
    padding-top: var(--space-5);
    border-left: 0;
    border-top: 1px solid var(--border-subtle);
  }
  .board { padding: var(--space-4) var(--space-4) var(--space-5); }
  .board__header { flex-direction: column; align-items: flex-start; }
  .rail__main { flex-direction: column; }
}

/* ==================================================================
   Reduced motion
   ================================================================== */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .view-enter { animation: none; }
}

/* Print: the board, on paper, without the chrome. */
@media print {
  .focus__capture, .board__actions, .card__done, .card__menu,
  .banner-host, .toasts, .review-prompt__actions { display: none !important; }
  body { background: var(--bg-surface); }
  .card { break-inside: avoid; box-shadow: none; }
}

// ===== js/theme.js =====
'use strict';

/**
 * Forefront — light and dark.
 *
 * Dark mode was on the non-goals list for a long time, for a reason worth
 * keeping in mind: a theme switcher is the classic first step towards a
 * settings screen, and this app does not have one. So this is deliberately the
 * smallest thing that is still the industry-standard behaviour:
 *
 *   - three states, not two: Light, Dark, and System (the default). Two-state
 *     toggles are the common bug — once you have touched one you can never get
 *     back to following the operating system, which is what most people
 *     actually want most of the time.
 *   - the choice is applied before the first paint, from an inline script in
 *     index.html, so a dark-mode user never gets a white flash on a start page
 *     they open twenty times a day.
 *   - while the preference is "system", a change to the OS setting is picked
 *     up live, without a reload.
 *
 * `<html data-theme>` always carries the RESOLVED theme — "light" or "dark",
 * never "system" — so css/tokens.css only needs one dark block instead of
 * duplicating the whole palette inside a prefers-color-scheme media query.
 * `<html data-theme-pref>` carries the preference itself, for the control that
 * has to show which of the three is chosen.
 *
 * Where the preference is stored, and why it is not in the export:
 *
 * CLAUDE.md says the exported JSON is the whole application state. This is the
 * second deliberate exception to that, after the file handle. Light or dark is
 * a property of the screen you are sitting at, not of your work: the same
 * dataset opened on a laptop in a bright office and on a desktop at night
 * wants different answers, and syncing a theme between them would be a bug,
 * not a feature. It also would mean rewriting the connected data file every
 * time someone flicks the switch. So it lives in its own browser-storage key
 * and nothing else knows about it.
 */

  var C = FF.C;

  var PREFS = ['system', 'light', 'dark'];

  var LABELS = {
    system: 'Match system',
    light: 'Light',
    dark: 'Dark'
  };

  var pref = 'system';
  var listeners = [];
  var query = null;

  // ------------------------------------------------------------------
  // Reading and writing the preference
  // ------------------------------------------------------------------

  function isPref(value) { return PREFS.indexOf(value) !== -1; }

  /**
   * Storage here is best-effort on purpose. Everywhere else in Forefront a
   * failed write is surfaced loudly, because it means losing work — but the
   * worst case here is that the app opens in the system theme next time, which
   * is not worth a banner. Safari refuses storage entirely for file:// pages,
   * and that must not stop the toggle working for the current session.
   */

      var stored = window.localStorage.getItem(C.LS_THEME_KEY);

    } catch (e) {
      return 'system';

    try {
      window.localStorage.setItem(C.LS_THEME_KEY, value);
      return true;

      return false;

  // Applying it

    write(value);
    apply();

    LABELS: LABELS,
    init: init,
    set: set,
    cycle: cycle,
    onChange: onChange,
    describe: describe,
    get: function () { return pref; },
