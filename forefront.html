  <script>
// ===== js/data.js =====
'use strict';

/**
 * Forefront — the Data panel.
 *
 * Deliberately out of the way, and deliberately complete. This is where you get
 * your JSON out to hand to an assistant, get the groomed version back in, point
 * Forefront at a file in a synced folder, and — importantly — read a straight
 * answer about where your data actually lives in this browser right now.
 *
 * The export is the whole dataset, always: open cards, the Inbox, completed
 * work well past the point it left the board, discarded work, ordering,
 * timestamps, review history, metadata, schema version. It is a backup, not a
 * task list. The one thing it cannot carry is the browser's handle on a
 * connected file, because that is a permission this browser granted to this
 * machine, not a fact about your work.
 */

(function (FF) {
  var ui = FF.ui;
  var el = ui.el;
  var model = FF.model;
  var C = FF.C;

  function open(app) {
    ui.openDialog({
      className: 'dialog--data',
      labelledBy: 'data-title',
      build: function (close) {
        return el('div', { class: 'dialog__body data-panel' }, [
          el('div', { class: 'dialog__head' }, [
            el('h2', { class: 'dialog__title', id: 'data-title', text: 'Data' }),
            el('button', { type: 'button', class: 'dialog__close', 'aria-label': 'Close', text: '×', onclick: function () { close(); } })
          ]),
          renderWhereItLives(app, close),
          renderExport(app),
          renderImport(app, close),
          renderDiscarded(app, close)
        ]);
      }
    });
  }

  // ------------------------------------------------------------------
  // Where the data lives — the honest readout
  // ------------------------------------------------------------------

  function renderWhereItLives(app, close) {
    var s = FF.storage.status();
    var caps = s.caps;
    var rows = [];

    if (s.connected) {
      rows.push(line('Data file', s.fileName, 'ok'));
      rows.push(note(s.canRememberFile
        ? 'Forefront will reopen this file automatically next time.'
        : 'This browser cannot remember the file between sessions — you will need to reconnect it each time you open Forefront. That is a limitation of pages opened directly from disk, not of Forefront.'));
    } else if (s.needsReconnect) {
      rows.push(line('Data file', s.fileName + ' — permission needed', 'warn'));
    } else {
      rows.push(line('Data file', 'None connected', 'muted'));
    }

    rows.push(line('Browser storage',
      caps.localStorage ? 'Working, used as the safety copy' : 'Blocked by this browser',
      caps.localStorage ? 'ok' : 'bad'));

    if (!caps.localStorage) {
      rows.push(note(caps.fileProtocol
        ? 'This browser refuses storage for pages opened directly from disk. Start Forefront with its launcher instead — start-mac.command, start-windows.cmd or start-linux.sh — which runs it on localhost, where storage works.'
        : 'Your browser is blocking site data. Private browsing and some managed policies do this.'));
    } else if (caps.fileProtocol) {
      // Every page opened from disk shares one storage area in Chrome — the
      // origin is the bare string "file://". Worth saying plainly, because it
      // is the real reason to connect a file rather than rely on this.
      rows.push(note('Forefront is running from a file on disk. Browser storage for local files is shared with every other local page you open in this browser, so it is not a private place to keep work information. Connecting a data file keeps your data out of it.'));
      rows.push(note('Browser storage can also be cleared by the browser itself under disk pressure, or by "clear browsing data". Treat it as a safety copy, not a backup.'));
    }

    var actions = [];

    if (s.needsReconnect) {
      actions.push(btn('Reconnect ' + s.fileName, 'primary', function () {
        close();
        app.reconnectFile();
      }));
    }

    if (caps.fileWrite && !s.connected) {
      actions.push(btn('Connect a data file…', s.needsReconnect ? 'quiet' : 'primary', function () {
        connectExisting(app, close);
      }));
      actions.push(btn('Create a new data file…', 'quiet', function () {
        createNew(app, close);
      }));
    }

    if (s.connected) {
      actions.push(btn('Reload from file', 'quiet', function () {
        FF.storage.reloadFromFile().then(function (res) {
          if (!res.ok) return ui.toast(res.error, 'error');
          close();
          // Explicitly asked for, and the outgoing board is kept recoverable.
          app.adoptFromFile(res.data, res.fileName, { force: true });
        });
      }));
      actions.push(btn('Disconnect', 'faint', function () {
        ui.confirmDialog({
          title: 'Disconnect the data file?',
          message: 'Forefront will keep working from browser storage. The file itself is left exactly as it is.',
          confirmLabel: 'Disconnect'
        }).then(function (yes) {
          if (!yes) return;
          FF.storage.disconnect().then(function (res) {
            close();
            ui.toast(res.ok ? 'Data file disconnected' : res.error, res.ok ? 'info' : 'error');
            app.refresh();
          });
        });
      }));
    }

    if (!caps.fileWrite) {
      rows.push(note('Forefront is fully usable with browser storage in this browser. Directly connected JSON files are a Chrome enhancement; use Export and Import below for a portable backup.'));
    }

    return section('Where your data lives', rows.concat(
      actions.length ? [el('div', { class: 'data-panel__actions' }, actions)] : []
    ));
  }

  /**
   * Connect an existing file.
   *
   * Picking and connecting are separate steps: the file is read first and only
   * installed once the user has agreed to what it will do. Backing out here
   * leaves whatever was connected before completely untouched.
   */
  function connectExisting(app, close) {
    FF.storage.pickFile().then(function (res) {
      if (res.cancelled) return;
      if (!res.ok) return ui.toast(res.error, 'error');

      function install(seed) {
        FF.storage.useHandle(res.handle, res.stamp, res.fileName, seed).then(function (r) {
          if (!r.ok) return ui.toast(r.error, 'error');
          close();
          if (seed) {
            ui.toast('Now saving to ' + res.fileName, 'ok');
            app.refresh();
          } else {
            // The user has just confirmed exactly what this replaces.
            app.adoptFromFile(res.data, res.fileName, { force: true });
          }
          warnIfNotRemembered(r);
        });
      }

      // A blank file: keep what is on screen and fill it.
      if (res.empty) return install(model.serialize(app.getData()));

      var mine = app.getData().cards.length;
      if (!mine) return install(null);

      ui.confirmDialog({
        title: 'Load ' + res.fileName + '?',
        message: 'That file has its own cards. Loading it replaces the ' + mine +
                 (mine === 1 ? ' card' : ' cards') + ' currently open here. A copy of the current board is kept and can be recovered from this panel.',
        confirmLabel: 'Load the file'
      }).then(function (yes) {
        if (yes) install(null);
        // Declining changes nothing at all — no connection was made yet.
      });
    });
  }

  function createNew(app, close) {
    FF.storage.pickNewFile().then(function (res) {
      if (res.cancelled) return;
      if (!res.ok) return ui.toast(res.error, 'error');

      FF.storage.useHandle(res.handle, res.stamp, res.fileName, model.serialize(app.getData()))
        .then(function (r) {
          if (!r.ok) return ui.toast(r.error, 'error');
          close();
          ui.toast('Now saving to ' + res.fileName, 'ok');
          warnIfNotRemembered(r);
          app.refresh();
        });
    });
  }

  function warnIfNotRemembered(r) {
    if (!r.remembered) {
      ui.toast('Connected. This browser will not remember the file, so reconnect it next session.', 'info');
    }
  }

  // ------------------------------------------------------------------
  // Export
  // ------------------------------------------------------------------

  function renderExport(app) {
    var data = app.getData();
    var stats = summarize(data);

    return section('Export', [
      el('p', { class: 'data-panel__lede', text:
        'One file with everything in it: ' + stats + '. Enough to restore Forefront exactly on another computer, and readable enough to hand to an AI assistant for grooming.' }),
      el('div', { class: 'data-panel__actions' }, [
        btn('Download JSON', 'primary', function () { downloadJSON(app.getData()); }),
        btn('Copy to clipboard', 'quiet', function () { copyJSON(app.getData()); })
      ]),

      // The annotated pair. Strict JSON has no comments, so an annotated file
      // is not valid JSON — which would normally make it useless. It is useful
      // here because Import strips comments on the way back in, so the file
      // that explains itself is also the file you can hand back.
      note('An annotated copy carries the whole format in comments — the lanes, what a card needs, ' +
           'and what Forefront deliberately has no field for. It is the thing to paste into a chat ' +
           'along with "add these to my board". Comments are stripped when you import it back.'),
      el('div', { class: 'data-panel__actions' }, [
        btn('Copy annotated', 'quiet', function () {
          copyText(model.annotate(app.getData()), 'Annotated JSON copied to clipboard');
        }),
        btn('Download annotated', 'quiet', function () {
          downloadText(model.annotate(app.getData()), 'forefront-' + model.dateKey(new Date()) + '.jsonc');
        }),
        btn('Blank template', 'faint', function () {
          downloadText(model.annotate(model.createEmptyData()), 'forefront-template.jsonc');
        })
      ])
    ]);
  }

  function summarize(data) {
    var active = data.cards.filter(function (c) { return model.isActive(c) && !c.completedAt; }).length;
    var done = data.cards.filter(function (c) { return c.completedAt && model.isActive(c); }).length;
    var dropped = data.cards.filter(function (c) { return c.discardedAt; }).length;
    var parts = [
      active + (active === 1 ? ' open card' : ' open cards'),
      done + ' completed',
      dropped + ' discarded',
      data.weeklyReviews.length + (data.weeklyReviews.length === 1 ? ' weekly review' : ' weekly reviews')
    ];
    return parts.join(', ');
  }

  function exportFilename() {
    return 'forefront-' + model.dateKey(new Date()) + '.json';
  }

  function downloadJSON(data) { downloadText(model.serialize(data), exportFilename()); }

  function downloadText(text, filename) {
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // Revoking immediately can cut the download short in some browsers.
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      ui.toast('Exported ' + filename, 'ok');
    } catch (e) {
      ui.toast('Download failed. Use "Copy to clipboard" instead.', 'error');
    }
  }

  function copyJSON(data) { copyText(model.serialize(data), 'JSON copied to clipboard'); }

  function copyText(json, successMessage) {

    function fallback() {
      // execCommand is deprecated but is the only route when the async
      // clipboard API is unavailable, which happens on some file:// pages.
      try {
        var area = el('textarea', { value: json, class: 'sr-only' });
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(area);
        ui.toast(ok ? successMessage : 'Could not copy — use Download instead.', ok ? 'ok' : 'error');
      } catch (e) {
        ui.toast('Could not copy — use Download instead.', 'error');
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json)
        .then(function () { ui.toast(successMessage, 'ok'); })
        .catch(fallback);
    } else {
      fallback();
    }
  }

  // ------------------------------------------------------------------
  // Import
  // ------------------------------------------------------------------

  function renderImport(app, close) {
    var textarea = el('textarea', {
      class: 'data-panel__paste',
      rows: '6',
      placeholder: 'Paste Forefront JSON here…',
      'aria-label': 'Paste Forefront JSON'
    });

    var fileInput = el('input', {
      type: 'file', accept: '.json,.jsonc,application/json', class: 'sr-only',
      onchange: function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        file.text().then(function (text) {
          attemptImport(app, text, close, file.name);
          fileInput.value = '';
        }).catch(function () {
          ui.toast('Could not read that file.', 'error');
        });
      }
    });

    var rows = [
      el('p', { class: 'data-panel__lede', text:
        'Imported data is checked before anything changes, and the current board is kept as a recoverable copy first. You choose then whether to add the cards to your board or replace it.' }),
      note('A whole export, or just a list of titles an assistant wrote — ["Call the vendor back", ' +
           '"Book the offsite room"] is a valid file, and lands in Inbox. Comments and trailing commas ' +
           'are forgiven, and lane names like "In Progress" or "just do it" are understood.'),
      el('div', { class: 'data-panel__actions' }, [
        btn('Choose a file…', 'quiet', function () { fileInput.click(); }),
        fileInput
      ]),
      textarea,
      el('div', { class: 'data-panel__actions' }, [
        btn('Import pasted JSON', 'quiet', function () {
          if (!textarea.value.trim()) return ui.toast('Nothing pasted yet.', 'error');
          attemptImport(app, textarea.value, close, 'pasted JSON');
        })
      ])
    ];

    if (FF.storage.status().hasBackup) {
      rows.push(el('div', { class: 'data-panel__actions' }, [
        btn('Recover the previous dataset', 'faint', function () {
          var backup = FF.storage.readBackup();
          if (!backup) return ui.toast('No recoverable copy found.', 'error');
          attemptImport(app, backup, close, 'the recovered copy', { replaceOnly: true });
        })
      ]));
    }

    return section('Import', rows);
  }

  /**
   * @param options.replaceOnly  Recovering a backup is a restore, not a merge:
   *                             offering "add" there would silently double
   *                             every card the user still has.
   */
  function attemptImport(app, text, close, label, options) {
    options = options || {};

    // readAny, not JSON.parse: it strips comments, straightens a looser shape
    // and then runs exactly the same validation as any other route in.
    var result = model.readAny(text);

    if (!result.ok) return showReport(result, label, []);

    var choices = [];

    if (!options.replaceOnly && result.data.cards.length) {
      choices.push({
        label: 'Add to my board',
        kind: 'quiet',
        onSelect: function () { app.adoptMerged(result.data.cards); close(); }
      });
    }

    choices.push({
      label: 'Replace my data',
      kind: 'primary',
      onSelect: function () { app.adoptImported(result.data); close(); }
    });

    showReport(result, label, choices);
  }

  /** Always show what happened before anything changes. */
  function showReport(result, label, choices) {
    ui.openDialog({
      className: 'dialog--report',
      labelledBy: 'report-title',
      build: function (closeReport) {
        var counts = result.ok
          ? result.data.cards.length + (result.data.cards.length === 1 ? ' card' : ' cards') +
            ' and ' + result.data.weeklyReviews.length +
            (result.data.weeklyReviews.length === 1 ? ' weekly review' : ' weekly reviews')
          : null;

        var canMerge = choices.some(function (c) { return c.kind === 'quiet'; });

        return el('div', { class: 'dialog__body report' }, [
          el('h2', { class: 'dialog__title', id: 'report-title',
                     text: result.ok ? 'Ready to import' : 'Cannot import' }),
          el('p', { class: 'report__lede', text: result.ok
            ? 'Read ' + counts + ' from ' + label + '.'
            : 'Nothing was changed.' }),

          // Said here rather than in a tooltip, because these two buttons sit
          // next to each other and one of them throws away the current board.
          result.ok && canMerge ? el('p', { class: 'report__lede', text:
            'Adding puts them at the bottom of their lanes and leaves everything you already have. ' +
            'Replacing swaps the whole board for this file.' }) : null,

          list('report__errors', 'Problems', result.errors),
          list('report__rejected', 'Left out', result.rejected),
          list('report__warnings', 'Adjusted on the way in', result.warnings),

          el('div', { class: 'dialog__actions' }, [
            el('button', {
              type: 'button', class: 'btn btn--quiet',
              text: result.ok ? 'Cancel' : 'Close',
              onclick: function () { closeReport(); }
            })
          ].concat(result.ok ? choices.map(function (choice, i) {
            return el('button', {
              type: 'button', class: 'btn btn--' + choice.kind, text: choice.label,
              // Focus the first offered action, which is Add whenever adding
              // is possible: the safe one should be the one Enter lands on.
              'data-autofocus': i === 0 ? '' : null,
              onclick: function () { closeReport(); choice.onSelect(); }
            });
          }) : []))
        ]);
      }
    });
  }

  function list(className, heading, items) {
    if (!items || !items.length) return null;
    return el('div', { class: 'report__block ' + className }, [
      el('h3', { class: 'report__heading', text: heading + ' (' + items.length + ')' }),
      el('ul', { class: 'report__list' }, items.slice(0, 25).map(function (line) {
        return el('li', { text: line });
      })),
      items.length > 25 ? el('p', { class: 'report__more', text: '+' + (items.length - 25) + ' more.' }) : null
    ]);
  }

  // ------------------------------------------------------------------
  // Discarded work
  //
  // Discard is reversible and quiet. Permanent deletion lives down here, behind
  // a confirmation, because it is the one action in Forefront that actually
  // destroys history.
  // ------------------------------------------------------------------

  function renderDiscarded(app, close) {
    var data = app.getData();
    var dropped = data.cards
      .filter(function (c) { return c.discardedAt; })
      .sort(function (a, b) { return new Date(b.discardedAt) - new Date(a.discardedAt); });

    if (!dropped.length) {
      return section('Discarded', [
        el('p', { class: 'data-panel__lede', text: 'Nothing discarded. Cards you discard are kept here rather than deleted.' })
      ]);
    }

    return section('Discarded (' + dropped.length + ')', [
      el('p', { class: 'data-panel__lede', text: 'Kept, not deleted — deciding something no longer matters is worth remembering.' }),
      el('ul', { class: 'discarded__list' }, dropped.slice(0, 30).map(function (card) {
        return el('li', { class: 'discarded__item' }, [
          el('span', { class: 'discarded__title', text: card.title }),
          el('span', { class: 'discarded__when', text: ui.formatShort(card.discardedAt) }),
          el('button', {
            type: 'button', class: 'link link--small', text: 'Restore',
            onclick: function () { close(); app.restore(card.id); }
          }),
          el('button', {
            type: 'button', class: 'link link--small link--danger', text: 'Delete forever',
            onclick: function () {
              ui.confirmDialog({
                title: 'Delete permanently?',
                message: '“' + card.title + '” will be removed from your data entirely. This cannot be undone.',
                confirmLabel: 'Delete forever',
                danger: true
              }).then(function (yes) { if (yes) { close(); app.deleteForever(card.id); } });
            }
          })
        ]);
      })),
      dropped.length > 30 ? el('p', { class: 'report__more', text: '+' + (dropped.length - 30) + ' more in your data file.' }) : null
    ]);
  }

  // ---- small builders ----------------------------------------------

  function section(title, children) {
    return el('section', { class: 'data-panel__section' },
      [el('h3', { class: 'data-panel__heading', text: title })].concat(children.filter(Boolean)));
  }

  function line(label, value, tone) {
    return el('p', { class: 'data-line data-line--' + tone }, [
      el('span', { class: 'data-line__label', text: label }),
      el('span', { class: 'data-line__value', text: value })
    ]);
  }

  function note(text) { return el('p', { class: 'data-note', text: text }); }

  function btn(label, kind, onClick) {
    return el('button', { type: 'button', class: 'btn btn--' + kind, text: label, onclick: onClick });
  }

  FF.dataPanel = { open: open, downloadJSON: downloadJSON, exportFilename: exportFilename };
})(window.FF);
  </script>
  <script>
// ===== js/app.js =====
'use strict';

/**
 * Forefront — application shell.
 *
 * Holds the dataset, decides which view is on screen, and owns every path that
 * changes data. Views are pure renderers; they never touch the dataset
 * directly, they call an action here. That is what keeps "every change is
 * saved, and you are told when it isn't" true in one place rather than in
 * thirty.
 *
 * Rendering is a full rebuild of the current view on every change. At this
 * scale that is far simpler than reconciliation and fast enough to be
 * imperceptible; the only thing it costs is having to put keyboard focus back
 * afterwards, which restoreFocus() below handles.
 */

(function (FF) {
  var ui = FF.ui;
  var el = ui.el;
  var model = FF.model;
  var C = FF.C;

  var state = {
    data: null,
    view: 'focus',        // 'focus' | 'board'
    renderedView: null,   // what was on screen last render, to time transitions
    review: null,         // active review session, if any
    saveFailed: false,
    warnedPartial: false, // said once when only one storage tier is accepting writes
    conflict: false
  };

  var root = null;
  var renderedDay = null;   // the calendar day currently drawn on screen

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------

  function boot() {
    root = document.getElementById('app');

    // The inline script in index.html already put the theme on <html> before
    // the first paint. This picks up the same preference, and adds the live
    // listener so that a machine switching to dark at sunset switches the app
    // with it — a start page can sit open for days.
    FF.theme.init();
    FF.theme.onChange(function () { if (root.firstChild) render(); });

    applyWeeklyAccent();

    FF.storage.on('conflict', onFileConflict);
    FF.storage.on('fileerror', function (e) { showBanner('warn', e.message, []); });

    // Synchronous, so the page is on screen in this tick. Forefront is a start
    // page; it has no business showing a blank frame while it thinks.
    var start;
    try {
      start = FF.storage.begin();
      state.data = start.data;
    } catch (e) {
      state.data = model.createEmptyData();
      start = { data: state.data, fresh: true, notes: [] };
    }

    render();
    installKeyboard();
    installLifecycle();
    reportBootConditions(start);

    // Everything that needs to await something happens after first paint, and
    // only changes the screen if it actually found different data.
    FF.storage.resume().then(function (update) {
      if (!update) return;

      if (update.needsReconnect) return offerReconnect(update.fileName);

      if (update.notes && update.notes.length) {
        showBanner('warn', update.notes.join(' '), [{ label: 'Open Data', onClick: openData }]);
        return;
      }

      reconcileWithFile(update.data, update.fileName);
    }).catch(function () { /* the app is already usable; nothing to do */ });
  }

  /**
   * A file's contents have arrived — at boot, on reconnect, or on reload — and
   * there is already a board on screen. Decide what to do with them.
   *
   * The rule is that newer local work is never replaced without being asked.
   * There used to be a two-second grace window here to absorb clock jitter, and
   * it did exactly the wrong thing: any local change made within two seconds of
   * the file's timestamp was silently thrown away. The comparison is now
   * strict, and pending unwritten changes count as local work regardless of
   * what the clocks say.
   */
  function reconcileWithFile(parsed, fileName, options) {
    options = options || {};

    if (!parsed) {
      // An empty file — keep what is on screen and let it fill the file.
      commit({ render: false });
      return;
    }

    var result = model.validateData(parsed);
    if (!result.ok) {
      showBanner('warn', 'The data file ' + fileName + ' could not be read: ' +
        result.errors.join(' ') + ' Forefront is using its browser copy instead. The file has not been changed.', []);
      return;
    }

    var fileTime = new Date(result.data.meta.updatedAt);
    var localTime = new Date(state.data.meta.updatedAt);
    var localHasWork = state.data.cards.length > 0;
    var localIsNewer = localHasWork && (localTime > fileTime || FF.storage.hasUnwrittenChanges());

    if (localIsNewer && !options.force) {
      showBanner('warn',
        options.reason ||
        ('What is on screen is newer than ' + fileName + ' — most likely a session that closed before saving. Nothing has been overwritten.'),
        [
          { label: 'Keep what is on screen', primary: true, onClick: function () {
            ui.setBanner(null);
            // Keep a copy of what the file held before replacing it: this
            // direction destroys the file, and the other direction keeps a
            // backup, so they should be equally recoverable.
            FF.storage.readFileText().then(function (text) {
              if (text) FF.storage.writeBackup(text);
              return FF.storage.forceWrite(state.data);
            }).then(function (res) {
              ui.toast(res.ok ? 'Saved over ' + fileName : res.error, res.ok ? 'ok' : 'error');
            });
          } },
          { label: 'Load the file instead', onClick: function () {
            ui.setBanner(null);
            adoptValidated(result, fileName);
          } }
        ], false);
      return;
    }

    adoptValidated(result, fileName);
  }

  /** Take a validated dataset as the working board, keeping the old one. */
  function adoptValidated(result, fileName) {
    // A queued write describes the board we are about to replace. Leaving it
    // alive would let a later visibility/pagehide flush silently write the old
    // board back over the file the user just chose to load.
    FF.storage.discardPendingFileWrites();
    backupCurrent();
    state.data = result.data;
    // Local-only: this data came out of the file, so there is nothing to send
    // back to it.
    commit({ localOnly: true });

    if (result.warnings.length || result.rejected.length) {
      showBanner('warn', 'Loaded ' + fileName + ' with ' +
        (result.warnings.length + result.rejected.length) + ' adjustments. Open Data to see what changed.',
        [{ label: 'Open Data', onClick: openData }]);
    } else {
      ui.toast('Loaded ' + fileName, 'ok');
    }
  }

  /** Re-grant permission on a remembered file, then reconcile its contents. */
  function reconnectFile() {
    FF.storage.reconnect().then(function (res) {
      if (!res.ok) return ui.toast(res.error, 'error');
      ui.setBanner(null);
      if (res.invalid) {
        showBanner('warn', 'Reconnected to ' + res.fileName +
          ', but it is not valid JSON. Forefront is still using its browser copy and has not written to the file.', []);
        return;
      }
      reconcileWithFile(res.data, res.fileName, {
        reason: 'Reconnected to ' + res.fileName +
                ', but what is on screen is newer than the file. Nothing has been overwritten.'
      });
      render();
    });
  }

  function offerReconnect(fileName) {
    showBanner('warn',
      'Forefront remembers your data file (' + fileName + ') but needs your permission again before it can save to it. Until then it is saving to browser storage only.',
      [{ label: 'Reconnect', primary: true, onClick: reconnectFile }]);
  }

  /**
   * Say anything that needs saying about how this session started — before the
   * user types something and loses it. The one that really matters is having no
   * persistence at all, which is what a double-clicked Forefront in Safari
   * looks like.
   */
  function reportBootConditions(result) {
    var s = FF.storage.status();

    if (!s.caps.localStorage) {
      showBanner('bad',
        s.caps.fileProtocol
          ? 'This browser will not let a page opened from disk store data, so nothing you do here will be saved. Close this tab and start Forefront with its launcher — start-mac.command, start-windows.cmd or start-linux.sh — to reopen it on localhost, where storage works.'
          : 'This browser is blocking site data, so nothing you do here will be saved. Export before you close the tab.',
        s.caps.fileWrite ? [{ label: 'Connect a data file…', primary: true, onClick: openData }] : [],
        false);
      return;
    }

    var messages = (result.notes || []).slice();

    // Validation may have had to repair or set aside stored records. Saying
    // nothing would mean cards quietly disappearing between sessions.
    var report = result.report;
    if (report && (report.rejected.length || report.warnings.length)) {
      var parts = [];
      if (report.rejected.length) {
        parts.push(report.rejected.length +
          (report.rejected.length === 1 ? ' stored card or review could not be read and was left out' :
                                          ' stored cards or reviews could not be read and were left out'));
      }
      if (report.warnings.length) {
        parts.push(report.warnings.length +
          (report.warnings.length === 1 ? ' was repaired' : ' were repaired'));
      }
      messages.push('Forefront adjusted your stored data on load: ' + parts.join(', ') + '.');
    }

    if (messages.length) {
      showBanner('warn', messages.join(' '), [{ label: 'Open Data', onClick: openData }]);
    }
  }

  function onFileConflict(e) {
    state.conflict = true;
    showBanner('warn',
      (e.fileName || 'The connected data file') + ' changed outside Forefront, so it has not been overwritten. Your recent changes are safe in browser storage.',
      [
        { label: 'Load the file', primary: true, onClick: function () {
          FF.storage.reloadFromFile().then(function (res) {
            if (!res.ok) return ui.toast(res.error, 'error');
            state.conflict = false;
            ui.setBanner(null);
            // Chosen from a banner that already explained the situation.
            adoptFromFile(res.data, res.fileName, { force: true });
          });
        } },
        { label: 'Keep mine and overwrite', onClick: function () {
          ui.confirmDialog({
            title: 'Overwrite the file?',
            message: 'The version on disk will be replaced by what is on screen. Whatever changed it will be lost.',
            confirmLabel: 'Overwrite',
            danger: true
          }).then(function (yes) {
            if (!yes) return;
            // Keep what the file held first — this is the one direction that
            // destroys something the user cannot otherwise get back.
            FF.storage.readFileText().then(function (text) {
              if (text) FF.storage.writeBackup(text);
              return FF.storage.forceWrite(state.data);
            }).then(function (res) {
              state.conflict = false;
              ui.setBanner(null);
              ui.toast(res.ok ? 'File overwritten — the previous contents are recoverable from the Data panel' : res.error,
                       res.ok ? 'ok' : 'error');
            });
          });
        } }
      ], false);
  }

  // ------------------------------------------------------------------
  // Saving
  // ------------------------------------------------------------------

  /**
   * Persist, then re-render. Every action funnels through here, so a storage
   * failure can never be shown as success — the banner goes up and stays up
   * until a later save works.
   */
  function commit(options) {
    var res = FF.storage.save(state.data, options);

    if (!res.ok) {
      state.saveFailed = true;
      showBanner('bad', res.error, [{ label: 'Export now', primary: true, onClick: function () {
        FF.dataPanel.downloadJSON(state.data);
      } }], false);
    } else if (state.saveFailed) {
      state.saveFailed = false;
      if (!state.conflict) ui.setBanner(null);
      ui.toast('Saving again', 'ok');
    }

    if (res.ok && res.warning && !state.warnedPartial) {
      // Saved, but only to one of the two places. Say so once.
      state.warnedPartial = true;
      showBanner('warn', res.warning, []);
    }

    if (!options || options.render !== false) render();
    return res.ok;
  }

  // ------------------------------------------------------------------
  // Rendering
  // ------------------------------------------------------------------

  function render() {
    var focusedCardId = currentlyFocusedCardId();
    FF.board.cancelDrag();
    ui.closeMenu(false);

    document.body.dataset.view = state.view;
    document.body.dataset.review = state.review ? state.review.stepId() : '';
    renderedDay = model.dateKey(new Date());

    ui.clear(root);

    // The fade belongs to switching views, not to opening the app. Forefront is
    // a browser start page: the first paint has to be instant, and an animating
    // container is a container that is briefly invisible.
    var switched = state.renderedView !== null && state.renderedView !== state.view;
    state.renderedView = state.view;

    if (state.view === 'board') {
      var node = FF.board.render(state.data, actions, {
        reviewRail: state.review ? state.review.rail(state.data) : null,
        highlightStale: !!state.review && state.review.stepId() === 'prune',
        staleDays: FF.review.PRUNE_AGE_DAYS
      });
      if (switched) node.classList.add('view-enter');
      root.appendChild(node);
      FF.board.attachDrag(node, actions);
    } else {
      var focusNode = FF.focus.render(state.data, actions);
      var prompt = FF.review.renderPrompt(state.data, actions);
      var indicator = FF.review.renderIndicator(state.data, actions);
      // Before the two-column body, so the prompt spans the full width and the
      // commitments stay where they were. The reference node has to be a child
      // of focusNode — insertBefore throws on anything deeper, which is exactly
      // what happened when the commitments moved one level down into
      // .focus__body and this still pointed at .focus__main.
      if (prompt) focusNode.insertBefore(prompt, focusNode.querySelector('.focus__body'));
      if (indicator) focusNode.querySelector('.focus__actions').appendChild(indicator);
      if (switched) focusNode.classList.add('view-enter');
      root.appendChild(focusNode);
    }

    restoreFocus(focusedCardId);
  }

  function currentlyFocusedCardId() {
    var active = document.activeElement;
    if (!active || !active.closest) return null;
    var card = active.closest('[data-card-id]');
    return card ? card.dataset.cardId : null;
  }

  /** Put keyboard focus back on the card the user was on, so nudging a card up
   *  the lane with Alt+Up repeatedly actually works. */
  function restoreFocus(cardId) {
    if (!cardId) return;
    var node = root.querySelector('[data-card-id="' + cssEscape(cardId) + '"]');
    if (node) node.focus({ preventScroll: false });
  }

  /**
   * Put focus somewhere sensible after a dialog closes.
   *
   * Saving rebuilds the view, which destroys whatever opened the dialog. The
   * native <dialog> focus restore then aims at a detached node and focus lands
   * on <body>, so the next Tab starts from the top of the page. Landing on the
   * capture control instead keeps a keyboard user roughly where they were.
   */
  function focusCaptureControl() {
    var target = root.querySelector('[data-capture-trigger]');
    if (target) target.focus({ preventScroll: true });
  }

  function cssEscape(value) {
    if (window.CSS && window.CSS.escape) return window.CSS.escape(value);
    return String(value).replace(/["\\]/g, '\\$&');
  }

  function showBanner(kind, message, actionList, dismissible) {
    ui.setBanner({ kind: kind, message: message, actions: actionList || [], dismissible: dismissible !== false });
  }

  // ------------------------------------------------------------------
  // Weekly accent
  //
  // A different accent hue each calendar week, chosen from the week number so
  // it is identical on every machine and never changes between page loads.
  // Nothing moves; only colour shifts, and only slightly. This is the whole of
  // the "theme system" on purpose.
  // ------------------------------------------------------------------

  function applyWeeklyAccent() {
    var family = FF.ACCENT_FAMILIES[0];
    if (C.WEEKLY_ACCENT_ROTATION) {
      var monday = model.weekStart(new Date());
      var weeks = Math.floor(monday.getTime() / 604800000);
      family = FF.ACCENT_FAMILIES[((weeks % FF.ACCENT_FAMILIES.length) + FF.ACCENT_FAMILIES.length) % FF.ACCENT_FAMILIES.length];
    }
    document.documentElement.dataset.accent = family;
  }

  // ------------------------------------------------------------------
  // Actions — the only way data changes
  // ------------------------------------------------------------------

  function capture() {
    openCaptureDialog();
  }

  /**
   * Put a captured line in the Inbox, or leave the dataset exactly as it was.
   *
   * A capture that could not be stored keeps its dialog open with the text
   * still in it, to be retried. That is only honest if the dataset is not
   * quietly holding a copy as well: a card left in memory means the retry adds
   * a second one, and whichever save finally works then writes both. So the
   * add is rolled back — including meta.updatedAt, which decides whether the
   * board on screen counts as newer than the connected file.
   *
   * commit() is asked not to render, so the card never appears on screen in
   * the frame between adding it and taking it back.
   */
  function captureToInbox(text) {
    var updatedAtBefore = state.data.meta.updatedAt;
    var card = model.addCard(state.data, text, 'inbox');
    var saved = commit({ render: false });

    if (!saved) {
      // Not a user deleting anything — undoing an add that never reached
      // storage. The dialog is now the only copy of what they typed.
      model.deleteCardForever(state.data, card.id);
      state.data.meta.updatedAt = updatedAtBefore;
    }

    render();
    return saved;
  }

  function openCaptureDialog() {
    var input = el('input', {
      type: 'text',
      class: 'capture__input',
      placeholder: 'What just came to mind?',
      'aria-label': 'Capture a thought',
      autocomplete: 'off',
      spellcheck: 'true',
      'data-autofocus': ''
    });

    var handle = ui.openDialog({
      className: 'dialog--capture',
      label: 'Quick Capture',
      build: function (close) {
        function submit(keepOpen) {
          var text = input.value.trim();
          if (!text) { close(); return; }

          if (!captureToInbox(text)) {
            // The text stays on screen: it was not stored, and clearing the
            // field would be a lie about that.
            return;
          }

          ui.announce('Captured to Inbox');
          if (keepOpen) {
            input.value = '';
            input.focus();
            ui.toast('Captured', 'ok');
          } else {
            close();
            focusCaptureControl();
          }
        }

        return el('form', {
          class: 'capture',
          onsubmit: function (e) { e.preventDefault(); submit(false); }
        }, [
          input,
          el('div', { class: 'capture__foot' }, [
            el('span', { class: 'capture__dest', text: 'Goes to Inbox' }),
            el('span', { class: 'capture__hint' }, [
              el('kbd', { text: 'Enter' }),
              el('span', { text: ' to save · ' }),
              el('kbd', { text: 'Esc' }),
              el('span', { text: ' to cancel' })
            ])
          ])
        ]);
      }
    });

    // Ctrl/Cmd+Enter keeps the field open for a run of captures without
    // changing what plain Enter does.
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        if (captureToInbox(text)) { input.value = ''; ui.toast('Captured', 'ok'); }
      }
    });

    return handle;
  }

  function edit(cardId) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;

    var titleInput = el('input', {
      type: 'text', class: 'edit__title', value: card.title,
      'aria-label': 'Title', 'data-autofocus': '', autocomplete: 'off'
    });
    var notesInput = el('textarea', {
      class: 'edit__notes', rows: '4', value: card.notes || '',
      'aria-label': 'Notes', placeholder: 'Notes (optional)'
    });

    ui.openDialog({
      className: 'dialog--edit',
      label: 'Edit card',
      build: function (close) {
        function save() {
          var title = titleInput.value.trim();
          if (!title) { titleInput.focus(); return; }
          model.updateCard(state.data, cardId, { title: title, notes: notesInput.value });
          if (commit()) {
            close();
            // render() has already put focus back on the card itself.
            restoreFocus(cardId);
          }
        }

        return el('form', {
          class: 'edit',
          onsubmit: function (e) { e.preventDefault(); save(); }
        }, [
          titleInput,
          notesInput,
          el('div', { class: 'dialog__actions' }, [
            el('button', { type: 'button', class: 'btn btn--quiet', text: 'Cancel', onclick: function () { close(); } }),
            el('button', { type: 'submit', class: 'btn btn--primary', text: 'Save' })
          ])
        ]);
      }
    });
  }

  function complete(cardId) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;
    model.completeCard(state.data, cardId);
    commit();
    ui.announce('“' + card.title + '” marked done');
  }

  function discard(cardId) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;
    model.discardCard(state.data, cardId);
    commit();
    ui.announce('“' + card.title + '” discarded');
    ui.toast('Discarded — kept in your data', 'info');
  }

  // ------------------------------------------------------------------
  // The commitment limit
  //
  // In Progress takes FOCUS_COMMITMENTS cards and no more. Every deliberate
  // route into a lane — dragging, the card menu, Alt+arrow, "not finished
  // after all" — goes through move(), so gating it here gates all of them
  // with one check rather than four that can drift apart.
  //
  // What is NOT gated, on purpose: loading data. Import, restoring a backup
  // and reading a connected file must reproduce the file exactly, including a
  // board that is over the limit, because refusing part of a load is how you
  // lose work. The limit governs what you do on the board, not what your data
  // is allowed to contain — and the app renders an over-full lane correctly
  // either way.
  // ------------------------------------------------------------------

  function commitmentLimitReached() {
    return C.ENFORCE_COMMITMENT_LIMIT &&
           model.commitments(state.data).length >= C.FOCUS_COMMITMENTS;
  }

  /** True if the move may proceed. Explains itself when it may not. */
  function allowedIntoCommitments(card, fromLane, toLane) {
    if (toLane !== 'inprogress') return true;
    if (fromLane === 'inprogress') return true;   // reordering within the lane
    if (!commitmentLimitReached()) return true;

    refuseCommitment(card);
    return false;
  }

  function refuseCommitment(card) {
    var current = model.commitments(state.data);

    ui.announce('In Progress is full. Take one out before adding “' + card.title + '”.');

    ui.openDialog({
      className: 'dialog--limit',
      labelledBy: 'limit-title',
      build: function (close) {
        return el('div', { class: 'dialog__body' }, [
          el('h2', { class: 'dialog__title', id: 'limit-title', text: 'In Progress is full' }),
          el('p', { class: 'dialog__message', text:
            'Forefront holds ' + C.FOCUS_COMMITMENTS + ' commitments at a time, and “' +
            card.title + '” would be the ' + ordinal(current.length + 1) + '.' }),
          el('p', { class: 'dialog__message', text:
            'Take one of these out first — mark it done, or move it back to its lane — ' +
            'and then bring this one in. Forefront will not choose for you: which thing ' +
            'stops being a commitment is the decision worth making.' }),
          el('ol', { class: 'limit-list' }, current.map(function (c) {
            return el('li', { class: 'limit-list__item', text: c.title });
          })),
          el('div', { class: 'dialog__actions' }, [
            el('button', {
              type: 'button', class: 'btn btn--primary', text: 'Close',
              'data-autofocus': '', onclick: function () { close(); }
            })
          ])
        ]);
      }
    });
  }

  function ordinal(n) {
    var names = ['zeroth', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth'];
    return names[n] || (n + 'th');
  }

  function move(cardId, laneId, index, options) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;

    var fromLane = card.lane;
    if (!allowedIntoCommitments(card, fromLane, laneId)) return;
    var fromIndex = model.laneCards(state.data, fromLane)
      .findIndex(function (c) { return c.id === cardId; });

    model.moveCard(state.data, cardId, laneId, index);
    commit();

    if (options && options.fromDrag) return;

    // Only say something moved if something moved. Announcing a change that did
    // not happen is worse than silence for anyone relying on the announcement.
    var toIndex = model.laneCards(state.data, card.lane)
      .findIndex(function (c) { return c.id === cardId; });

    if (card.lane !== fromLane) {
      ui.announce('“' + card.title + '” moved to ' + FF.LANE_BY_ID[card.lane].label);
    } else if (toIndex !== fromIndex) {
      ui.announce('“' + card.title + '” moved to position ' + (toIndex + 1) + ' in ' + FF.LANE_BY_ID[card.lane].label);
    } else {
      ui.announce('“' + card.title + '” did not move');
    }
  }

  function nudge(cardId, delta) {
    if (!model.nudgeCard(state.data, cardId, delta)) {
      ui.announce('Already at the ' + (delta < 0 ? 'top' : 'bottom'));
      return;
    }
    commit();
    var card = model.findCard(state.data, cardId);
    var position = model.laneCards(state.data, card.lane)
      .findIndex(function (c) { return c.id === cardId; });
    ui.announce('Position ' + (position + 1));
  }

  /** Alt+Left / Alt+Right — step a card sideways through the lanes. */
  function shiftLane(cardId, delta) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;
    var at = FF.LANE_IDS.indexOf(card.lane);
    var next = FF.LANE_IDS[at + delta];
    if (!next) return;
    move(cardId, next, 0);
  }

  function restore(cardId) {
    var card = model.findCard(state.data, cardId);
    if (!card) return;

    // A discarded commitment coming back would be a fourth commitment. This
    // diverts it to Inbox rather than refusing: recovering work must always
    // succeed, and Inbox is where undecided things belong anyway. Refusing
    // here would mean a card you can see in the Data panel and cannot get
    // back, which is a worse bargain than re-filing it.
    var divert = C.ENFORCE_COMMITMENT_LIMIT &&
                 model.restoreLaneFor(card) === 'inprogress' &&
                 commitmentLimitReached();

    model.restoreCard(state.data, cardId);
    if (divert) model.moveCard(state.data, cardId, 'inbox', 0);
    commit();
    ui.toast(divert ? 'Restored to Inbox — In Progress is full' : 'Restored', 'ok');
  }

  function deleteForever(cardId) {
    model.deleteCardForever(state.data, cardId);
    commit();
    ui.toast('Deleted permanently', 'info');
  }

  // ---- views -------------------------------------------------------

  function showBoard(laneId) {
    state.view = 'board';
    render();
    if (laneId) {
      var lane = root.querySelector('.lane--' + laneId + ', .inbox[data-lane="' + laneId + '"]');
      if (lane && lane.scrollIntoView) lane.scrollIntoView({ block: 'nearest', inline: 'center' });
    }
  }

  function showFocus() {
    state.view = 'focus';
    state.review = null;
    render();
  }

  function openData() { FF.dataPanel.open(api); }

  // ---- review ------------------------------------------------------

  function startReview() {
    model.ensureReview(state.data, model.weekOf());
    state.review = FF.review.createSession(actions);
    state.view = 'board';
    commit();
  }

  function deferReview() {
    model.deferReview(state.data, model.weekOf());
    commit();
    ui.toast('Reminder will come back later today', 'info');
  }

  function skipReview() {
    model.skipReview(state.data, model.weekOf());
    commit();
    ui.toast('Skipped this week', 'info');
  }

  function finishReview() {
    model.completeReview(state.data, model.weekOf());
    state.review = null;
    state.view = 'focus';
    commit();
    ui.toast('Review recorded', 'ok');
  }

  /** Leave without recording it. The week stays pending, and the quiet
   *  indicator comes back — no decision has been made yet. */
  function abandonReview() {
    state.review = null;
    state.view = 'focus';
    render();
  }

  // ---- data panel callbacks ----------------------------------------

  /**
   * Take a file's contents. `options.force` skips the "what is on screen is
   * newer" check, and is used only where the user has just been shown exactly
   * what will be replaced and said yes — asking a second time in a banner would
   * be noise, not safety.
   */
  function adoptFromFile(parsed, fileName, options) {
    reconcileWithFile(parsed, fileName, options);
    render();
  }

  function adoptImported(validated) {
    backupCurrent();
    state.data = validated;
    commit();
    ui.toast('Data imported', 'ok');
  }

  /**
   * Add someone else's cards to the board rather than replacing it.
   *
   * Still takes a backup. Adding forty cards from a file you did not read
   * carefully is not destructive in principle and is very annoying in
   * practice, and "undo" here means "recover the previous dataset" in the
   * Data panel — which only exists if a copy was kept.
   */
  function adoptMerged(cards) {
    backupCurrent();
    var result = model.mergeCards(state.data, cards);
    commit();

    var message = result.added + (result.added === 1 ? ' card added' : ' cards added');
    if (result.duplicates.length) {
      message += ' — ' + result.duplicates.length +
        (result.duplicates.length === 1 ? ' has' : ' have') + ' a title already in that lane';
    }
    ui.toast(message, 'ok');
  }

  /**
   * Keep the outgoing dataset where it can be recovered. Never blocks the
   * operation it precedes — but if it could not be kept, say so, because the
   * UI has just told the user a copy was being kept.
   */
  function backupCurrent() {
    try {
      if (FF.storage.writeBackup(model.serialize(state.data))) return true;
    } catch (e) { /* fall through */ }
    ui.toast('Replaced — but this browser could not keep a recoverable copy of the previous board.', 'error');
    return false;
  }

  // ------------------------------------------------------------------
  // Keyboard
  // ------------------------------------------------------------------

  function isTyping(target) {
    if (!target) return false;
    var tag = target.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable;
  }

  function installKeyboard() {
    document.addEventListener('keydown', function (e) {
      if (e.defaultPrevented) return;
      if (isTyping(e.target)) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return; // leave browser shortcuts alone

      var key = e.key.toLowerCase();

      if (ui.anyDialogOpen() || ui.anyMenuOpen()) return; // they handle their own keys

      if (key === C.CAPTURE_KEY) { e.preventDefault(); capture(); }
      else if (key === 'b') { e.preventDefault(); state.view === 'board' ? showFocus() : showBoard(); }
      else if (key === 'f') { e.preventDefault(); showFocus(); }
      else if (key === 'd') { e.preventDefault(); openData(); }
      else if (key === C.THEME_KEY) { e.preventDefault(); cycleTheme(); }
      else if (key === '?') { e.preventDefault(); showHelp(); }
      else if (e.key === 'Escape' && state.view === 'board') { e.preventDefault(); showFocus(); }
    });
  }

  /**
   * Step the theme on, and say which one you landed in.
   *
   * The toast is not decoration: the key cycles three states, and going from
   * "Match system" to "Light" on a machine that is already light changes
   * nothing on screen at all. Without the toast that reads as a broken key.
   */
  function cycleTheme() {
    FF.theme.cycle();
    render();
    ui.toast('Theme: ' + FF.theme.describe(), 'info');
  }

  function showHelp() {
    var rows = [
      [C.CAPTURE_KEY_LABEL, 'Quick Capture'],
      ['B', 'Board / Focus'],
      ['F', 'Focus'],
      ['D', 'Data'],
      [C.THEME_KEY_LABEL, 'Light / dark / match system'],
      ['?', 'This list'],
      ['Esc', 'Close, or leave the board'],
      ['Enter', 'Edit the focused card'],
      ['Alt + ↑ ↓', 'Move the focused card up or down its lane'],
      ['Alt + ← →', 'Move the focused card to the next lane'],
      ['Ctrl/⌘ + Enter', 'In Quick Capture: save and stay open']
    ];

    ui.openDialog({
      className: 'dialog--help',
      labelledBy: 'help-title',
      build: function (close) {
        return el('div', { class: 'dialog__body' }, [
          el('h2', { class: 'dialog__title', id: 'help-title', text: 'Keyboard' }),
          el('dl', { class: 'help' }, rows.reduce(function (acc, row) {
            acc.push(el('dt', {}, [el('kbd', { text: row[0] })]));
            acc.push(el('dd', { text: row[1] }));
            return acc;
          }, [])),
          el('p', { class: 'help__note', text: 'Single-key shortcuts are ignored while you are typing.' }),
          el('div', { class: 'dialog__actions' }, [
            el('button', { type: 'button', class: 'btn btn--primary', text: 'Close', 'data-autofocus': '', onclick: function () { close(); } })
          ])
        ]);
      }
    });
  }

  // ------------------------------------------------------------------
  // Lifecycle
  // ------------------------------------------------------------------

  /**
   * Re-render when the date changes.
   *
   * Forefront is a start page: the tab stays open for days. Without this, the
   * date in the header, every card age, the Done visibility window and the
   * Monday review prompt are all frozen at whatever they were when the page
   * loaded — so a tab opened on Sunday would never offer Monday's review, and
   * a card would sit at "6d" for a week.
   *
   * One timer, re-armed each time. It fires a few seconds after midnight to
   * stay clear of the boundary itself, and re-reads the clock rather than
   * assuming 24 hours have passed, so daylight-saving changes and a laptop
   * waking from sleep both land correctly.
   */
  var midnightTimer = null;

  function scheduleMidnightRefresh() {
    if (midnightTimer) clearTimeout(midnightTimer);

    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
    var delay = next - now;

    // setTimeout saturates above ~24.8 days; nothing here approaches that, but
    // a machine that slept through the deadline should also just re-check.
    midnightTimer = setTimeout(function () {
      midnightTimer = null;
      state.renderedView = state.view; // a new day is not a view transition
      render();
      scheduleMidnightRefresh();
    }, Math.max(1000, delay));
  }

  function installLifecycle() {
    scheduleMidnightRefresh();

    // Waking from sleep, or coming back to the tab, may mean the date moved on
    // while no timer could fire.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (renderedDay !== model.dateKey(new Date())) {
        state.renderedView = state.view;
        render();
      }
      scheduleMidnightRefresh();
    });

    // visibilitychange is the reliable moment to force a pending file write
    // through; beforeunload cannot await an async write, and browsers may skip
    // it entirely. The browser-storage copy is already written synchronously,
    // so nothing is at risk either way.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') FF.storage.flush();
    });
    window.addEventListener('pagehide', function () { FF.storage.flush(); });
  }

  // ------------------------------------------------------------------

  var actions = {
    capture: capture,
    edit: edit,
    complete: complete,
    discard: discard,
    move: move,
    nudge: nudge,
    shiftLane: shiftLane,
    showBoard: showBoard,
    showFocus: showFocus,
    openData: openData,
    showHelp: showHelp,
    startReview: startReview,
    deferReview: deferReview,
    skipReview: skipReview,
    finishReview: finishReview,
    abandonReview: abandonReview,
    rerender: render
  };

  /** The surface the Data panel talks to. */
  var api = {
    getData: function () { return state.data; },
    adoptFromFile: adoptFromFile,
    adoptImported: adoptImported,
    adoptMerged: adoptMerged,
    reconnectFile: reconnectFile,
    restore: restore,
    deleteForever: deleteForever,
    refresh: render
  };

  FF.app = { boot: boot, actions: actions, api: api, state: state };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window.FF);
  </script>

  <!-- If css/ and js/ did not travel with this file, everything above is a
       blank sheet with nothing visibly wrong in it: no error, no console
       message a normal person will look at, just a white page. Copying
       index.html on its own is the obvious thing to try and it fails silently,
       so the file says what happened instead.

       This cannot fire when the folder is intact — FF.app only exists once
       js/app.js has run, and deferred scripts all execute before
       DOMContentLoaded. In the built forefront.html everything is inlined, so
       it never fires there either. -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Only the scripts are worth detecting. A missing css/ leaves a working
      // but unstyled app, which is obvious on sight; a missing js/ leaves a
      // blank page, which is not. Chrome also still reports a stylesheet
      // object for a <link> that failed to load, so testing for that would be
      // a check that quietly never fires.
      if (window.FF && window.FF.app) return;

      function line(text, style) {
        var p = document.createElement('p');
        p.textContent = text;
        p.setAttribute('style', 'margin:0 0 14px;' + (style || ''));
        return p;
      }

      var box = document.createElement('div');
      box.setAttribute('style',
        'max-width:34rem;margin:12vh auto;padding:28px 30px;border:1px solid #cad2e0;' +
        'border-radius:8px;background:#fff;color:#1a2436;' +
        'font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;');

      box.appendChild(line('Forefront could not start.',
        'font-size:21px;font-weight:600;margin-bottom:16px;'));
      box.appendChild(line(
        'This file needs the css and js folders that came with it, sitting beside ' +
        'it in the same place. Copying index.html on its own does not bring them along.',
        'color:#465369;'));
      box.appendChild(line(
        'Either copy the whole folder, or use forefront.html — that is the entire ' +
        'application in a single file and needs nothing next to it.',
        'color:#465369;margin-bottom:0;'));

      document.body.replaceChildren(box);
    });
  </script>
</body>
</html>
