   * Stable unique id. crypto.randomUUID needs a secure context; file:// counts
   * as one in Chrome and Edge but has been inconsistent in older Safari, so we
   * fall back through getRandomValues before giving up on Math.random.
   */
  function uid() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
    } catch (e) { /* fall through */ }

    try {
      if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
        var b = new Uint8Array(16);
        window.crypto.getRandomValues(b);
        b[6] = (b[6] & 0x0f) | 0x40; // version 4
        b[8] = (b[8] & 0x3f) | 0x80; // variant 10
        var hex = [];
        for (var i = 0; i < 16; i++) hex.push((b[i] + 0x100).toString(16).slice(1));
        return hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' +
               hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' +
               hex.slice(10, 16).join('');
      }
    } catch (e) { /* fall through */ }

    return 'ff-' + Date.now().toString(36) + '-' +
           Math.random().toString(36).slice(2, 10);
  }

  function nowISO() { return new Date().toISOString(); }

  function isObject(v) {
    return v !== null && typeof v === 'object' && !Array.isArray(v);
  }

  function isValidDate(d) {
    return d instanceof Date && !isNaN(d.getTime());
  }

  /** Parse a timestamp leniently; return an ISO string or null. */
  function toISO(value) {
    if (value === null || value === undefined || value === '') return null;
    var d = new Date(value);
    return isValidDate(d) ? d.toISOString() : null;
  }

  /** Midnight local time for a date — the basis for calendar-day maths. */
  function startOfDay(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  /**
   * Whole calendar days between two dates, in local time. Deliberately not
   * "elapsed / 86400000": a card written at 11pm yesterday should read 1d this
   * morning, not 0d. Math.round absorbs the 23- and 25-hour days that daylight
   * saving transitions produce.
   */
  function dayDiff(from, to) {
    return Math.round((startOfDay(to) - startOfDay(from)) / 86400000);
  }

  /** YYYY-MM-DD in local time. Not toISOString(), which would shift the day. */
  function dateKey(date) {
    var m = date.getMonth() + 1;
    var d = date.getDate();
    return date.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
  }

  /** The review day (Monday by default) on or before the given date. */
  function weekStart(date) {
    var d = startOfDay(date);
    var delta = (d.getDay() - C.REVIEW_DAY + 7) % 7;
    d.setDate(d.getDate() - delta);
    return d;
  }

  function weekOf(date) { return dateKey(weekStart(date || new Date())); }

  // ------------------------------------------------------------------
  // Construction
  // ------------------------------------------------------------------

  /**
   * A pristine, valid, empty Forefront dataset.
   *
   * This must stay structurally identical to sample-data/empty.json. The file
   * on disk exists so you can seed a OneDrive file by copying it; this function
   * exists because a page loaded from file:// cannot fetch() an adjacent file,
   * so the app cannot read that JSON at runtime. tools/check-samples.js
   * verifies the two agree.
   */
  function createEmptyData() {
    var ts = nowISO();
    return {
      schemaVersion: C.SCHEMA_VERSION,
      app: C.APP_NAME,
      meta: { createdAt: ts, updatedAt: ts },
      cards: [],
      weeklyReviews: []
    };
  }

  function createCard(title, lane) {
    var ts = nowISO();
    return {
      id: uid(),
      title: String(title == null ? '' : title).trim(),
      notes: '',
      lane: lane || 'inbox',
      order: 0,
      createdAt: ts,
      updatedAt: ts,
      completedAt: null,
      discardedAt: null,
      /** The lane a card was living in when it was completed or discarded.
       *  Nothing in V1 displays this. It is recorded because "what management
       *  work did I actually finish this year" is unanswerable without it, and
       *  one nullable string now is cheaper than regretting it later. */
      sourceLane: null
    };
  }

  function createReview(weekKey, status) {
    return {
      weekOf: weekKey,
      status: status || 'pending',
      completedAt: null,
      commitmentIds: [],
      /** Timestamps of each "Later". Kept in the data file rather than in
       *  browser storage so that an exported dataset really is the whole of
       *  Forefront's state, and so deferral patterns stay reviewable later. */
      deferrals: [],
      note: ''
    };
  }

  // ------------------------------------------------------------------
  // Queries
  // ------------------------------------------------------------------

  function isActive(card) { return !card.discardedAt; }

  function byOrder(a, b) {
    if (a.order !== b.order) return a.order - b.order;
    return String(a.id).localeCompare(String(b.id)); // stable tiebreak
  }

  /** Age of a card in whole days. */
  function ageDays(card, now) {
    var created = new Date(card.createdAt);
    if (!isValidDate(created)) return 0;
    return Math.max(0, dayDiff(created, now || new Date()));
  }

  /** "today", "1d", "12d" — gentle awareness, never an alarm. */
  function ageLabel(card, now) {
    var d = ageDays(card, now);
    return d === 0 ? 'today' : d + 'd';
  }

  /**
   * Cards in a lane, in order. Discarded cards never appear anywhere, and Done
   * shows only recent completions — older ones stay in the JSON forever but
   * stop cluttering the board, which is how the board cleans itself up without
   * anyone deleting their own history.
   */
  function laneCards(data, laneId, now) {
    var ref = now || new Date();
    var out = [];
    for (var i = 0; i < data.cards.length; i++) {
      var c = data.cards[i];
      if (c.lane !== laneId || !isActive(c)) continue;
      if (laneId === 'done' && !isRecentlyDone(c, ref)) continue;
      out.push(c);
    }
    return out.sort(byOrder);
  }

  function isRecentlyDone(card, now) {
    if (!card.completedAt) return false;
    var done = new Date(card.completedAt);
    if (!isValidDate(done)) return false;
    return dayDiff(done, now || new Date()) < C.DONE_VISIBLE_DAYS;
  }

  /** All completed cards, newest first — the permanent record, not the lane. */
  function completedCards(data) {
    return data.cards
      .filter(function (c) { return c.completedAt && isActive(c); })
      .sort(function (a, b) { return new Date(b.completedAt) - new Date(a.completedAt); });
  }

  /** Cards completed since a given date, newest first. Used by Look Back. */
  function completedSince(data, since) {
    return completedCards(data).filter(function (c) {
      return new Date(c.completedAt) >= since;
    });
  }

  /** The commitments Focus View is built from. */
  function commitments(data) { return laneCards(data, 'inprogress'); }

  function findCard(data, id) {
    for (var i = 0; i < data.cards.length; i++) {
      if (data.cards[i].id === id) return data.cards[i];
    }
    return null;
  }

  /** Counts per lane for the Focus View footer. */
  function laneCounts(data, now) {
    var counts = {};
    FF.LANE_IDS.forEach(function (id) { counts[id] = laneCards(data, id, now).length; });
    return counts;
  }

  // ------------------------------------------------------------------
  // Mutations
  //
  // Every mutation renumbers the lanes it touched to 0..n-1 and stamps
  // meta.updatedAt. Order is stored densely and rewritten on every move, which
  // is a little more work per move but means the JSON is always obvious to read
  // and impossible to get subtly wrong.
  // ------------------------------------------------------------------

  function touch(data) { data.meta.updatedAt = nowISO(); }

  function normalizeLane(data, laneId) {
    var cards = data.cards
      .filter(function (c) { return c.lane === laneId && isActive(c); })
      .sort(byOrder);
    for (var i = 0; i < cards.length; i++) cards[i].order = i;
  }

  function normalizeAll(data) { FF.LANE_IDS.forEach(function (id) { normalizeLane(data, id); }); }

  /** Add a card to the top of a lane. Capture goes to the top of Inbox so the
   *  newest thought is the first one you see when you sit down to triage. */
  function addCard(data, title, lane) {
    var card = createCard(title, lane || 'inbox');
    data.cards.push(card);
    var siblings = laneCards(data, card.lane);
    for (var i = 0; i < siblings.length; i++) {
      if (siblings[i].id !== card.id) siblings[i].order += 1;
    }
    card.order = 0;
    normalizeLane(data, card.lane);
    touch(data);
    return card;
  }

  function updateCard(data, id, fields) {
    var card = findCard(data, id);
    if (!card) return null;
    if (typeof fields.title === 'string') card.title = fields.title.trim();
    if (typeof fields.notes === 'string') card.notes = fields.notes;
    card.updatedAt = nowISO();
    touch(data);
    return card;
  }

  /**
   * Move a card to a lane at a given index. This is the single path for every
   * reorder, every lane change, every completion by drag and every un-completion
   * by dragging back out, so the rules about completedAt live in exactly one
   * place.
   */
  function moveCard(data, id, toLane, toIndex) {
    var card = findCard(data, id);
    if (!card || FF.LANE_IDS.indexOf(toLane) === -1) return null;

    var fromLane = card.lane;

    if (toLane === 'done' && !card.completedAt) {
      card.completedAt = nowISO();
      card.sourceLane = fromLane;
    } else if (toLane !== 'done' && card.completedAt) {
      // Dragged back out of Done: it is not finished after all.
      card.completedAt = null;
      card.sourceLane = null;
    }

    card.lane = toLane;
    card.updatedAt = nowISO();

    // Insert by fractional order, then renumber. Placing the card halfway
    // between its new neighbours is enough to land it in the right slot once
    // normalizeLane rewrites the whole lane to dense integers.
    var siblings = laneCards(data, toLane).filter(function (c) { return c.id !== id; });
    var idx = Math.max(0, Math.min(toIndex == null ? siblings.length : toIndex, siblings.length));
    var before = idx === 0 ? -1 : siblings[idx - 1].order;
    var after = idx >= siblings.length ? before + 2 : siblings[idx].order;
    card.order = (before + after) / 2;

    normalizeLane(data, toLane);
    if (fromLane !== toLane) normalizeLane(data, fromLane);
    touch(data);
    return card;
  }

  /** Nudge a card one position within its lane. The keyboard equivalent of a
   *  short drag. Returns true if anything actually moved. */
  function nudgeCard(data, id, delta) {
    var card = findCard(data, id);
    if (!card) return false;
    var siblings = laneCards(data, card.lane);
    var at = siblings.findIndex(function (c) { return c.id === id; });
    var target = at + delta;
    if (at === -1 || target < 0 || target >= siblings.length) return false;
    moveCard(data, id, card.lane, target);
    return true;
  }

  function completeCard(data, id) {
    var card = findCard(data, id);
    if (!card) return null;
    // Newest completion sits at the top of Done.
    return moveCard(data, id, 'done', 0);
  }

  /**
   * Discard: "I have decided this no longer matters", which is a different fact
   * from "I finished this" and worth keeping apart. The card leaves every lane
   * but stays in the JSON, so a future review can look at what was dropped as
   * well as what was done.
   */
  function discardCard(data, id) {
    var card = findCard(data, id);
    if (!card) return null;
    var fromLane = card.lane;
    card.discardedAt = nowISO();
    card.sourceLane = card.sourceLane || fromLane;
    card.updatedAt = nowISO();
    normalizeLane(data, fromLane);
    touch(data);
    return card;
  }

  /**
   * Undo a discard, putting the card back where it was.
   *
   * A card that had been completed before it was discarded goes back to Done
   * with its completion intact. Clearing completedAt here would quietly rewrite
   * history — turning "I finished this in March, then tidied it away" into "I
   * never finished it" — and completion records are the one thing this app
   * promises never to lose.
   */
  function restoreCard(data, id) {
    var card = findCard(data, id);
    if (!card) return null;

    card.discardedAt = null;

    if (card.completedAt) {
      card.lane = 'done';
    } else {
      card.lane = restoreLaneFor(card);
      card.sourceLane = null;
    }

    card.updatedAt = nowISO();
    moveCard(data, id, card.lane, 0);
    return card;
  }

  /** Where an uncompleted card should return to. 'done' is not an answer —
   *  a card can only reach Done by being completed. */
  function restoreLaneFor(card) {
    var lane = card.sourceLane;
    return (lane && lane !== 'done' && FF.LANE_IDS.indexOf(lane) !== -1) ? lane : 'inbox';
  }

  /** Irreversible. Deliberately not reachable from ordinary card controls. */
  function deleteCardForever(data, id) {
    var idx = data.cards.findIndex(function (c) { return c.id === id; });
    if (idx === -1) return false;
    var lane = data.cards[idx].lane;
    data.cards.splice(idx, 1);
    normalizeLane(data, lane);
    touch(data);
    return true;
  }

  // ------------------------------------------------------------------
  // Weekly review
  // ------------------------------------------------------------------

  function reviewFor(data, weekKey) {
    for (var i = 0; i < data.weeklyReviews.length; i++) {
      if (data.weeklyReviews[i].weekOf === weekKey) return data.weeklyReviews[i];
    }
    return null;
  }

  function ensureReview(data, weekKey) {
    var r = reviewFor(data, weekKey);
    if (!r) {
      r = createReview(weekKey, 'pending');
      data.weeklyReviews.push(r);
      touch(data);
    }
    return r;
  }

  function deferReview(data, weekKey) {
    var r = ensureReview(data, weekKey);
    if (r.status === 'pending') {
      r.deferrals.push(nowISO());
      touch(data);
    }
    return r;
  }

  function skipReview(data, weekKey) {
    var r = ensureReview(data, weekKey);
    r.status = 'skipped';
    r.completedAt = nowISO();
    touch(data);
    return r;
  }

  function completeReview(data, weekKey) {
    var r = ensureReview(data, weekKey);
    r.status = 'completed';
    r.completedAt = nowISO();
    r.commitmentIds = commitments(data).map(function (c) { return c.id; });
    touch(data);
    return r;
  }

  /**
   * What, if anything, Forefront should say about the review right now.
   *
   *   'due'     — offer the prompt (review day, not yet done, not deferred recently)
   *   'pending' — deferred a moment ago; show only a quiet indicator
   *   'missed'  — the review day passed without a decision; a quiet indicator, no nagging
   *   'none'    — nothing to say
   */
  function reviewState(data, now) {
    var ref = now || new Date();
    var key = weekOf(ref);
    var r = reviewFor(data, key);

    if (r && (r.status === 'completed' || r.status === 'skipped')) return 'none';

    var isReviewDay = startOfDay(ref).getTime() === weekStart(ref).getTime();

    if (isReviewDay) {
      if (r && r.deferrals.length) {
        var last = new Date(r.deferrals[r.deferrals.length - 1]);
        var hours = (ref - last) / 3600000;
        // hours >= 0 matters: a data file synced from a machine whose clock runs
        // fast can carry a deferral stamped in the future, and without this a
        // single "Later" would suppress the prompt until that future arrived.
        if (hours >= 0 && hours < C.REVIEW_DEFER_HOURS) return 'pending';
      }
      return 'due';
    }

    // The review day has passed without a decision.
    //
    // Only say so if Forefront was actually in use that day. Opening the app
    // for the first time on a Wednesday and being told you missed a review you
    // were never offered is precisely the kind of unearned reproach that makes
    // people stop opening a tool.
    if (r) return 'missed';

    var created = new Date(data.meta && data.meta.createdAt);
    if (isValidDate(created) && created < weekStart(ref)) return 'missed';

    return 'none';
  }

  // ------------------------------------------------------------------
  // Migration
  // ------------------------------------------------------------------

  /**
   * Bring an older dataset up to the current schema. There is only one schema
   * version so far, so this is a placeholder with a real shape: add a case per
   * version, migrate forward one step at a time, and leave newer-than-known
   * data alone for validate() to reject.
   */
  function migrateData(data) {
    if (!isObject(data)) return data;
    var v = typeof data.schemaVersion === 'number' ? data.schemaVersion : 0;

    if (v < 1) {
      data.schemaVersion = 1;
      if (!isObject(data.meta)) data.meta = { createdAt: nowISO(), updatedAt: nowISO() };
      if (!Array.isArray(data.cards)) data.cards = [];
      if (!Array.isArray(data.weeklyReviews)) data.weeklyReviews = [];
    }

    // if (data.schemaVersion === 1) { ...migrate to 2...; data.schemaVersion = 2; }

    return data;
  }

  // ------------------------------------------------------------------
  // Validation
  //
  // Import is the one place hostile or broken data can enter, so it is checked
  // properly. Two rules govern this code: never overwrite good data with
  // rubbish, and never silently discard a record. Anything repairable is
  // repaired and reported; anything unusable is set aside and reported; unknown
  // fields are passed through untouched so that a future version's data, or an
  // AI assistant's annotations, survive a round trip.
  // ------------------------------------------------------------------

  var STATUSES = ['pending', 'completed', 'skipped'];
  var DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;

  function validateData(raw) {
    var errors = [];
    var warnings = [];
    var rejected = [];

    if (!isObject(raw)) {
      return { ok: false, errors: ['This is not a Forefront dataset — the file does not contain a JSON object.'], warnings: warnings, rejected: rejected, data: null };
    }

    if (typeof raw.schemaVersion !== 'number' || !isFinite(raw.schemaVersion)) {
      warnings.push('No schemaVersion found; assuming version ' + C.SCHEMA_VERSION + '.');
      raw.schemaVersion = C.SCHEMA_VERSION;
    }
    if (raw.schemaVersion > C.SCHEMA_VERSION) {
      return {
        ok: false,
        errors: ['This file uses schema version ' + raw.schemaVersion + ', but this copy of Forefront understands version ' + C.SCHEMA_VERSION + '. Update Forefront before importing it — importing now could lose data the newer version added.'],
        warnings: warnings, rejected: rejected, data: null
      };
    }

    if (raw.app && raw.app !== C.APP_NAME) {
      warnings.push('The "app" field says "' + String(raw.app).slice(0, 40) + '" rather than "' + C.APP_NAME + '". Importing anyway.');
    }

    var data = migrateData(raw);

    if (!Array.isArray(data.cards)) {
      errors.push('"cards" is missing or is not a list.');
      return { ok: false, errors: errors, warnings: warnings, rejected: rejected, data: null };
    }
    if (!Array.isArray(data.weeklyReviews)) {
      warnings.push('"weeklyReviews" was missing or malformed; starting with an empty review history.');
      data.weeklyReviews = [];
    }
    if (!isObject(data.meta)) {
      warnings.push('"meta" was missing; timestamps have been regenerated.');
      data.meta = { createdAt: nowISO(), updatedAt: nowISO() };
    }
    data.meta.createdAt = toISO(data.meta.createdAt) || nowISO();
    data.meta.updatedAt = toISO(data.meta.updatedAt) || nowISO();

    // ---- Cards -----------------------------------------------------
    var seenIds = Object.create(null);
    var cards = [];

    data.cards.forEach(function (rawCard, i) {
      var where = 'Card ' + (i + 1);

      if (!isObject(rawCard)) {
        rejected.push(where + ' is not an object and was left out.');
        return;
      }

      var title = typeof rawCard.title === 'string' ? rawCard.title.trim() : '';
      if (!title) {
        rejected.push(where + ' has no title and was left out.');
        return;
      }

      // Start from the raw object so unrecognised fields survive untouched.
      var card = copyFields(rawCard);

      card.title = title;

      var id = typeof rawCard.id === 'string' ? rawCard.id.trim() : '';
      if (!id) {
        id = uid();
        warnings.push(where + ' ("' + shorten(title) + '") had no id; one was generated.');
      } else if (seenIds[id]) {
        id = uid();
        warnings.push(where + ' ("' + shorten(title) + '") repeated an id already in use; it was given a new one.');
      }
      seenIds[id] = true;
      card.id = id;

      card.notes = typeof rawCard.notes === 'string' ? rawCard.notes : '';

      var lane = resolveLane(rawCard.lane);
      if (!lane) {
        warnings.push(where + ' ("' + shorten(title) + '") had an unrecognised lane "' +
          String(rawCard.lane).slice(0, 30) + '"; it was put in Inbox so you can re-file it.');
        card.lane = 'inbox';
      } else {
        if (lane !== rawCard.lane) {
          warnings.push(where + ' ("' + shorten(title) + '") called its lane "' +
            String(rawCard.lane).slice(0, 30) + '"; that was read as ' + FF.LANE_BY_ID[lane].label + '.');
        }
        card.lane = lane;
      }

      var order = Number(rawCard.order);
      card.order = isFinite(order) ? order : i;

      card.createdAt = toISO(rawCard.createdAt);
      if (!card.createdAt) {
        card.createdAt = nowISO();
        warnings.push(where + ' ("' + shorten(title) + '") had no usable createdAt; it is dated today, so its age starts over.');
      }
      card.updatedAt = toISO(rawCard.updatedAt) || card.createdAt;
      card.completedAt = toISO(rawCard.completedAt);
      card.discardedAt = toISO(rawCard.discardedAt);
      // 'done' is never a meaningful sourceLane: it records where a card came
      // FROM when it was completed, and nothing is completed out of Done.
      card.sourceLane = (rawCard.sourceLane !== 'done' &&
                         FF.LANE_IDS.indexOf(rawCard.sourceLane) !== -1) ? rawCard.sourceLane : null;

      // Keep the two ways of saying "done" consistent with each other.
      if (card.lane === 'done' && !card.completedAt) {
        card.completedAt = card.updatedAt;
        warnings.push(where + ' ("' + shorten(title) + '") was in Done without a completion time; its last-updated time was used.');
      }
      if (card.lane !== 'done' && card.completedAt && !card.discardedAt) {
        card.lane = 'done';
        warnings.push(where + ' ("' + shorten(title) + '") had a completion time but was not in Done; it was moved to Done.');
      }

      cards.push(card);
    });

    data.cards = cards;

    // ---- Weekly reviews --------------------------------------------
    var seenWeeks = Object.create(null);
    var reviews = [];

    data.weeklyReviews.forEach(function (rawReview, i) {
      var where = 'Weekly review ' + (i + 1);

      if (!isObject(rawReview)) {
        rejected.push(where + ' is not an object and was left out.');
        return;
      }
      if (typeof rawReview.weekOf !== 'string' || !DATE_KEY_RE.test(rawReview.weekOf)) {
        rejected.push(where + ' has no usable "weekOf" date and was left out.');
        return;
      }
      if (seenWeeks[rawReview.weekOf]) {
        rejected.push(where + ' duplicates the week of ' + rawReview.weekOf + ' and was left out.');
        return;
      }
      seenWeeks[rawReview.weekOf] = true;

      var review = copyFields(rawReview);

      review.status = STATUSES.indexOf(rawReview.status) !== -1 ? rawReview.status : 'pending';
      review.completedAt = toISO(rawReview.completedAt);
      review.commitmentIds = Array.isArray(rawReview.commitmentIds)
        ? rawReview.commitmentIds.filter(function (x) { return typeof x === 'string'; })
        : [];
      review.deferrals = Array.isArray(rawReview.deferrals)
        ? rawReview.deferrals.map(toISO).filter(Boolean)
        : [];
      review.note = typeof rawReview.note === 'string' ? rawReview.note : '';

      reviews.push(review);
    });

    data.weeklyReviews = reviews.sort(function (a, b) {
      return a.weekOf < b.weekOf ? -1 : a.weekOf > b.weekOf ? 1 : 0;
    });

    data.app = C.APP_NAME;
    normalizeAll(data);

    return { ok: true, errors: errors, warnings: warnings, rejected: rejected, data: data };
  }

  /**
   * Copy every own field, including ones Forefront does not recognise.
   *
   * defineProperty rather than assignment because JSON.parse produces a real
   * own "__proto__" key when the text contains one, and plain assignment would
   * hand it to the prototype setter instead — silently losing the field and
   * changing the object's prototype. Neither is acceptable in the one function
   * that promises not to throw anything away.
   */
  function copyFields(source) {
    var out = {};
    Object.keys(source).forEach(function (k) {
      Object.defineProperty(out, k, {
        value: source[k], writable: true, enumerable: true, configurable: true
      });
    });
    return out;
  }

  function shorten(text) {

  // ------------------------------------------------------------------
  // Lane names as people write them
  //

  // assistant asked to sort a pile of sticky notes will write "Just Do It" or
  // "in progress" or "doing". Rather than reject a file over punctuation, a
  // lane name is matched with the spaces, hyphens and capitals removed, plus a
  // short list of words that unambiguously mean one of the six.
  //

    ['admin', 'management'], ['people', 'management'], ['leadership', 'management'],
    ['managing', 'management'],
    ['project', 'projects'], ['deepwork', 'projects'],
    ['quick', 'justdoit'], ['quickwins', 'justdoit'], ['chores', 'justdoit'],
    ['errands', 'justdoit'], ['small', 'justdoit'], ['justdo', 'justdoit'],
    ['doing', 'inprogress'], ['active', 'inprogress'], ['wip', 'inprogress'],
    ['committed', 'inprogress'], ['commitments', 'inprogress'], ['focus', 'inprogress'],
    ['now', 'inprogress'], ['current', 'inprogress'],
    ['complete', 'done'], ['completed', 'done'], ['finished', 'done'], ['closed', 'done']

  //

  // it. Comments are removed, a looser shape is straightened into the real

        changed = true;
        while (i < text.length && text.charAt(i) !== '\n') i++;

      }

      if (ch === '/' && next === '*') {
        changed = true;
        i += 2;

        i += 2;
        continue;
      }

   *
   * The reason this exists: "I had a list of sticky notes and got an assistant
   * to turn them into a file" is an ADD, and offering only Replace would mean
   * the obvious action wipes a board of real commitments.
   *

   * Forefront, and an import has not earned any: nothing you paste in gets to

  function nextOrder(data, laneId) {

  }

  // ------------------------------------------------------------------
  // Writing a file for somebody — or something — else to read
  // ------------------------------------------------------------------

  /**
   * What the format is, in prose, for pasting to an assistant along with the

    'Forefront data file.',
    '',
    'Forefront is an attention-management board. Everything it knows is in this',
    'one file. It can be edited by hand or generated wholesale — the importer',
    'checks everything, repairs what it can, and reports the rest, so an',
    'imperfect file is safe to try.',
    '',
    'Comments like this one are allowed. Strict JSON has none, so Forefront',
    'strips them on the way in. Trailing commas are forgiven too.',
    '',
    'THE LANES, left to right on the board:',
    '',
    '  inbox        Just captured. Not yet decided. Empty this by dragging.',
    '  management   Running a team: reviews, staffing, vendors, the org.',
    '  projects     Substantial work with a shape to it.',
    '  justdoit     Under about five minutes. Kept narrow on purpose so a pile',
    '               of small chores cannot outrank one hard thing.',
    '  inprogress   Committed to. The top three of these ARE the home screen.',
    '  done         Finished. Leaves the board after a few days, is never',
    '               deleted.',
    '',
    'Lane names are matched loosely: "In Progress", "in-progress" and "doing"',
    'all mean inprogress. Anything unrecognised lands in inbox rather than',
    'being guessed at.',
    '',
    'THERE IS NO priority field, due date, tag, estimate, subtask or',
    'recurrence, and adding one to this file will not create one. Priority is',
    'position: within a lane, "order" ascending is most-important first.',
    '',
    'A CARD needs nothing but a title. Everything else is filled in for you:',
    '',
    '  title        required. Plain text.',
    '  lane         one of the six above. Defaults to inbox.',
    '  notes        optional. A sentence or two of detail, not a document.',
    '  order        position within the lane, ascending. Defaults to the order',
    '               the cards appear in this file.',
    '  id           a unique string. Generated if missing.',
    '  createdAt    ISO 8601. Defaults to now, which restarts the card\'s age.',
    '  completedAt  ISO 8601, and only for cards in done.',
    '  discardedAt  ISO 8601. Set means "dropped without doing it" — a soft',

    '',
    'THE SMALLEST USEFUL FILE is a bare list of titles:',
    '',
    '  ["Call the vendor back", "Book the offsite room"]',
    '',
    'They arrive in Inbox to be triaged. Grouping by lane also works:',
    '',
    '  { "inbox": ["Call the vendor back"], "Just Do It": ["Book the room"] }',

    lines.push('');
    lines.push('{');
    lines.push('  "schemaVersion": ' + JSON.stringify(data.schemaVersion) + ',');
    lines.push('  "app": ' + JSON.stringify(data.app || C.APP_NAME) + ',');
    lines.push('  "meta": ' + JSON.stringify(data.meta) + ',');

    lines.push('');
    lines.push('  // One entry per Monday you were offered the weekly review, whether or');

'use strict';

/**
 * Forefront — persistence.
 *
 * The awkward truth this file exists to handle: the app is meant to be opened
 * by double-clicking index.html, and it is meant to keep its data in a file you
 * choose (a OneDrive folder, say) — and browsers deliberately make those two
 * things hard to combine. Rather than pretend otherwise, Forefront probes what
 * the browser will actually let it do, uses the best available option, and says
 * plainly in the Data panel which one is in force.
 *
 * Two tiers, and the first is always on:
 *
 *   1. Browser storage (localStorage). Written synchronously after every change.
 *      Always the safety net, even when a file is connected.
 *   2. A connected JSON file, via the File System Access API. Written through
 *      after a short debounce. This is the human-readable, syncable, portable
 *      copy — the one you hand to an AI assistant.

 * assumes one active writer. If a connected file changed underneath it, it
 * stops, says so, and lets you choose. It never silently overwrites.
 */

(function (FF) {

  // ------------------------------------------------------------------
  // Capability probing
  //
  // All of this is measured at runtime rather than inferred from the user
  // agent, because the answers differ between http(s) and file:// on the same
  // browser, and because they have changed over time.
  // ------------------------------------------------------------------

  var caps = {
    localStorage: false,
    indexedDB: false,       // needed only to remember a file between sessions
    filePicker: false,      // can choose a file to read
    fileSave: false,        // can choose a path to create
    fileWrite: false,       // can actually write back to a chosen file

  function probeLocalStorage() {

   * the handle on a connected data file, which cannot be persisted any other
   * way.

   * so all three are treated as "no" and the whole thing is bounded by a
   * timeout. Nothing waits on this — it runs after first paint.
   */
  function probeIndexedDB() {

      var settled = false;
      function done(v) { if (!settled) { settled = true; resolve(v); } }
      var timer = setTimeout(function () { done(false); }, 1500);

      try {

    // hand you a FileSystemFileHandle without giving you createWritable, so

  // IndexedDB: the one thing it is used for is remembering a file handle,
  // which is the only way to persist one (handles are structured-cloneable
  // but not serialisable to a string).
  // ------------------------------------------------------------------

  function idb() {

      var req = window.indexedDB.open(C.IDB_NAME, 1);

        var req = tx.objectStore(C.IDB_STORE).get(key);

    return idb().then(function (db) {

        var tx = db.transaction(C.IDB_STORE, 'readwrite');
        tx.objectStore(C.IDB_STORE).delete(key);
        tx.oncomplete = function () { db.close(); resolve(true); };
        tx.onerror = function () { db.close(); resolve(false); };

  // ------------------------------------------------------------------
  // Browser-storage tier
  // ------------------------------------------------------------------

  /**
   * A note on browser storage under file://.
   *
   * Chrome gives every page loaded from disk the same origin — the literal
   * string "file://", not one origin per path. Two consequences, both verified
   * rather than assumed:
   *
   *   Good: moving or renaming the Forefront folder does not lose your data,
   *   because the storage was never tied to the path.
   *
   *   Bad: every other local HTML file you open in the same browser shares that
   *   storage area and can read these keys. That is why the keys are namespaced,
   *   why nothing sensitive should live only here, and why connecting a real
   *   data file is the right answer for work you care about. It is a property of

   */

    }

      return {
        ok: false,
        error: quota
          ? 'Browser storage is full, so this change was not saved. Export your data now, then clear space.'

   * must never be mistaken for a first run, because the difference between

  function localRead() {

'use strict';

/**

 * The page you actually see. Everything about this view is subtraction: the

 * What is here is the handful of things you already decided mattered, set large
 * enough that a glance is enough, and a way to write down whatever just
 * occurred to you.

 * The counts along the bottom are the one concession to the backlog existing at
 * all. They are numbers, not links to guilt — small, quiet, and deliberately
 * not clickable-looking enough to invite browsing.

  var ui = FF.ui;
  var el = ui.el;
  var model = FF.model;
  var C = FF.C;

    var top = all.slice(0, C.FOCUS_COMMITMENTS);
    var extra = all.length - top.length;

    return el('div', { class: 'focus' }, [
      renderHeader(data, actions),
      // A <div>, not a <main>: index.html already provides the page's single
      // <main> landmark and nesting a second one inside it is invalid.
      el('div', { class: 'focus__body' }, [
        el('div', { class: 'focus__main' }, [
          el('h2', { class: 'focus__label', id: 'focus-label', text: 'Focus' }),
          top.length
            ? renderCommitments(top, actions)
            : renderEmpty(actions),
          // One line, not two. An earlier version printed "+2 more active" and
          // "5 active — Focus works best with 3" one under the other, which is
          // the same fact told twice and reads as fussing.
          //
          // With the commitment limit enforced this can now only happen to a
          // board that arrived over the limit through an import, so it says
          // what to do about it rather than offering advice.
          extra > 0 ? el('p', {
            class: 'focus__extra',
            text: '+' + extra + ' more in In Progress. Focus shows ' + C.FOCUS_COMMITMENTS +
                  ' — take ' + extra + ' out on the board.'

          renderCapture(actions)
        ]),
        renderQuick(data, actions)
      ]),
      renderFooter(data, actions)

   * when the page opens. So this is a column and not a second half: narrower,
   * set at body size against the commitments' 30px, in secondary text, behind
   * a hairline — a margin note, not a board.
   *
   * And it is capped. Five-minute chores genuinely belong on the home screen
   * — they are what you do in the gaps between hard things — but an unbounded
   * list of them is a backlog, and the backlog is not the home screen. Five
   * rows and a count is the useful half; the rest stays where it lives.

    var cards = model.laneCards(data, lane.id);

    var hidden = cards.length - shown.length;

      el('h2', { class: 'focus__label', id: 'quick-label', text: lane.label }),

    return el('li', {
      class: 'quick__item',

      // Same rule as a commitment: Enter edits the row, unless focus is on the

        ui.icon('mark', 'wordmark__mark'),

    var label = card.title;

    var item = el('li', {
      class: 'commitment',
      dataset: { cardId: card.id },
      tabindex: '0',
      onkeydown: function (e) {
        if (e.key !== 'Enter' || e.altKey) return;
        // The Done button is inside this item, so its Enter arrives here too.
        // Claiming it would cancel the button and open Edit instead.
        if (e.target !== e.currentTarget) return;
        e.preventDefault();

      ondblclick: function () { actions.edit(card.id); }
    }, [
      el('button', {
        type: 'button',
        class: 'commitment__done',
        'aria-label': 'Mark “' + label + '” done',
        title: 'Mark done',
        onclick: function (e) { e.stopPropagation(); actions.complete(card.id); }
      }, [tick()]),
      // No notes indicator here on purpose. Focus View is for being reminded
      // what matters, not for reading detail, and a lone dot beside a title
      // reads as a typo more than as information.

        el('span', { class: 'commitment__title', text: card.title })
      ]),
      el('span', {
        class: 'commitment__age',
        text: model.ageLabel(card),
        title: 'Added ' + ui.formatShort(card.createdAt)

  function renderEmpty(actions) {
    return el('div', { class: 'focus__empty' }, [
      el('p', { class: 'focus__empty-line', text: 'Nothing committed yet.' }),
      el('button', {
        type: 'button',
        class: 'link',
        text: 'Open the board and choose what matters',
        onclick: actions.showBoard
      })

  function renderCapture(actions) {
    return el('div', { class: 'focus__capture' }, [
      el('button', {
        type: 'button',
        class: 'capture-button',
        'data-capture-trigger': '',
        onclick: actions.capture
      }, [
        el('span', { class: 'capture-button__plus', 'aria-hidden': 'true', text: '+' }),
        el('span', { text: 'Quick Capture' }),
        el('kbd', { class: 'capture-button__key', text: C.CAPTURE_KEY_LABEL || 'N' })
      ])
    ]);
  }

  function renderFooter(data, actions) {
    var counts = model.laneCounts(data);

    // Counts are for what you cannot see. Done never had one; In Progress and
    // Just Do It are both on screen now, and a number repeating what is three
    // inches above it is the same fact told twice.
    var HIDDEN_FROM_COUNTS = ['done', 'inprogress', 'justdoit'];

    var lanes = FF.LANES.filter(function (l) {
      return HIDDEN_FROM_COUNTS.indexOf(l.id) === -1;
    }).map(function (lane) {
      return el('button', {
        type: 'button',
        class: 'count' + (counts[lane.id] === 0 ? ' count--zero' : ''),
        'aria-label': counts[lane.id] + ' in ' + lane.label + ' — open the board',
        onclick: function () { actions.showBoard(lane.id); }
      }, [
        el('span', { class: 'count__label', text: lane.label }),
        el('span', { class: 'count__value', text: String(counts[lane.id]) })
      ]);
    });

    return el('footer', { class: 'focus__footer' }, [
      el('div', { class: 'counts' }, lanes),
      el('div', { class: 'focus__actions' }, [
        el('button', {
          type: 'button', class: 'btn btn--ghost', text: 'Show Board',
          onclick: function () { actions.showBoard(); }
        }),
        el('button', {
          type: 'button', class: 'btn btn--faint', text: 'Data',
          onclick: actions.openData
        }),
        el('button', {
          type: 'button', class: 'btn btn--faint', text: 'Shortcuts',
          onclick: actions.showHelp
        }),
        ui.themeControl(actions.rerender)
      ])
    ]);
  }

  /**
   * A hand-drawn tick, so no icon font or image file is needed.
   *
   * The drawing itself moved to ui.icon when the theme control needed a tick
   * for its menu; this stays as the name the rest of the app already calls,
   * rather than having two ticks that can drift apart.
   */
  function tick() { return ui.icon('tick'); }

'use strict';

/**
 * Forefront — Board View.
 *
 * The planning surface. You come here on purpose, rearrange things, and leave.
 *
 * Two decisions here carry most of the product's weight:
 *
 * Inbox is not a sixth column. It is a shallow strip across the top, because it
 * is a holding pen you empty rather than a place work lives. Making it a column
 * would quietly turn it into another backlog.
 *
 * Just Do It is narrower and set in a lighter key than Management and Projects.
 * Twelve five-minute chores are easier to look at than one hard document, and
 * without this they would win that competition every time.

(function (FF) {
  var ui = FF.ui;
  var el = ui.el;
  var model = FF.model;
  var C = FF.C;

  var dragController = null;

  function render(data, actions, options) {
    options = options || {};
    var counts = model.laneCounts(data);

    var board = el('div', { class: 'board' }, [
      renderHeader(actions),
      options.reviewRail || null,
      renderInbox(data, counts.inbox, actions, options),
      el('div', { class: 'board__scroller' }, [
        el('div', { class: 'board__lanes' },
          FF.LANES.filter(function (l) { return l.id !== 'inbox'; })
                  .map(function (lane) { return renderLane(lane, data, counts, actions, options); })
        )

      el('button', {
        type: 'button', class: 'wordmark wordmark--button',
        title: 'Back to Focus', 'aria-label': 'Back to Focus',
        onclick: actions.showFocus
      }, [
        ui.icon('mark', 'wordmark__mark'),
        el('span', { text: 'Forefront' })
      ]),
      el('div', { class: 'board__actions' }, [
        el('button', { type: 'button', class: 'btn btn--quiet', 'data-capture-trigger': '', onclick: actions.capture }, [
          el('span', { 'aria-hidden': 'true', text: '+ ' }),
          el('span', { text: 'Quick Capture' })
        ]),
        el('button', { type: 'button', class: 'btn btn--primary', text: 'Focus', onclick: actions.showFocus }),
        el('button', { type: 'button', class: 'btn btn--faint', text: 'Data', onclick: actions.openData }),
        el('button', { type: 'button', class: 'btn btn--faint', text: 'Shortcuts', onclick: actions.showHelp }),
        ui.themeControl(actions.rerender)

  // ---- Inbox -------------------------------------------------------

    return el('section', {
      class: 'inbox' + (cards.length ? '' : ' inbox--empty'),
      'aria-labelledby': 'inbox-heading',
      dataset: { lane: 'inbox' }
    }, [
      el('div', { class: 'inbox__bar' }, [
        el('h2', { class: 'inbox__heading', id: 'inbox-heading' }, [
          el('span', { text: 'Inbox' }),
          el('span', { class: 'inbox__count', text: String(count) })
        ]),
        cards.length
          ? el('p', { class: 'inbox__hint', text: 'Drag each one into a lane, or discard it.' })
          : null
      ]),
      el('ul', {
        class: 'inbox__list',
        dataset: { laneList: '', lane: 'inbox', orientation: 'horizontal' },

  // ---- Lanes -------------------------------------------------------

    var cards = model.laneCards(data, lane.id);
    var classes = ['lane', 'lane--' + lane.id];
    if (lane.secondary) classes.push('lane--secondary');
    if (lane.emphasis) classes.push('lane--emphasis');
    if (lane.terminal) classes.push('lane--terminal');

    var headingId = 'lane-' + lane.id + '-heading';

    return el('section', {
      class: classes.join(' '),
      dataset: { lane: lane.id },
      style: { '--lane-weight': String(lane.weight) },
      'aria-labelledby': headingId
    }, [
      el('div', { class: 'lane__header' }, [
        el('h2', { class: 'lane__title', id: headingId, text: lane.label }),
        el('span', { class: 'lane__count', text: String(counts[lane.id]) }),
        lane.id === 'inprogress' ? commitmentNote(counts.inprogress) : null,
        lane.id === 'done'

      el('ul', {

      class: classes.join(' '),
      dataset: { cardId: card.id },
      tabindex: '0',
      ondblclick: function () { actions.edit(card.id); },
      onkeydown: function (e) { onCardKey(e, card, laneId, actions, menuButton); }

        type: 'button',
        class: 'card__done',
        'aria-label': 'Mark “' + card.title + '” done',
        title: 'Mark done',
        onclick: function (e) { e.stopPropagation(); actions.complete(card.id); }

        onSelect: function () { actions.move(card.id, model.restoreLaneFor(card), 0); }

 * Forefront — the Monday review.
 *
 * The point of this ritual is to stop Forefront becoming the next productivity
 * app you quietly stop opening. So it has to be small enough that doing it is
 * easier than avoiding it.
 *
 * Two deliberate choices:
 *
 * The Monday prompt is an inline panel on Focus View, not a modal. On a Monday
 * you may have opened the browser because something is on fire at 8am, and a
 * dialog demanding a decision before you can move is exactly the behaviour that
 * makes people resent a tool. "Later" gets out of the way in one click.
 *
 * The review itself is a rail across the top of the ordinary board rather than
 * a wizard. Triaging and re-ranking ARE dragging cards around a board; building
 * a separate set of classification forms to do the same job would be slower and
 * would teach you a second way to use the app for no reason.
 */

(function (FF) {
  var ui = FF.ui;
  var el = ui.el;
  var model = FF.model;
  var C = FF.C;

  var STEPS = [
    {
      id: 'look-back',
      title: 'Look back',
      guide: 'This is what actually got done.',
      body: renderLookBack
    },
    {
      id: 'triage',
      title: 'Empty the Inbox',
      guide: 'Move each capture into a lane, or discard it. If you leave one here, make that a deliberate choice.',
      body: renderTriage
    },
    {
      id: 'prune',
      title: 'Decide what is still worth carrying',
      guide: 'For anything stale: advance it, name the next action, delegate it, or drop it. Age is evidence, not a verdict.',
      body: renderPrune
    },
    {
      id: 'rerank',
      title: 'Put them in order',
      guide: 'Reorder the cards within Management, Projects and Just Do It. Position is the priority; the most important work belongs at the top.',
      body: null
    },
    {
      id: 'commit',
      title: 'Commit',
      guide: 'If Friday came and only three meaningful things were done, which three would you most want them to be?',
      body: renderCommit
    }
  ];

  /** How far back "look back" reaches when there is no previous review. */
  var LOOK_BACK_DAYS = 7;

  /** A card older than this is worth a second look during Prune. */
  var PRUNE_AGE_DAYS = 14;

  // ------------------------------------------------------------------
  // The Monday prompt
  // ------------------------------------------------------------------

  /** The inline panel offering the review. Returns null when there is nothing
   *  to say, which is most days. */
  function renderPrompt(data, actions) {
    if (model.reviewState(data) !== 'due') return null;

    return el('section', { class: 'review-prompt', 'aria-labelledby': 'review-prompt-title' }, [
      el('div', { class: 'review-prompt__text' }, [
        el('h2', { class: 'review-prompt__title', id: 'review-prompt-title', text: 'Weekly review' }),
        el('p', { class: 'review-prompt__sub', text: 'Two minutes to reset what matters this week.' })
      ]),
      el('div', { class: 'review-prompt__actions' }, [
        el('button', { type: 'button', class: 'btn btn--primary', text: 'Review now', onclick: actions.startReview }),
        el('button', { type: 'button', class: 'btn btn--quiet', text: 'Later', onclick: actions.deferReview }),
        el('button', { type: 'button', class: 'btn btn--faint', text: 'Skip this week', onclick: actions.skipReview })
      ])
    ]);
  }

  /**
   * The quiet residue. "Later" leaves a pending mark; a Monday that passed
   * without a decision leaves a missed mark. Neither does anything more than
   * sit there — no colour, no badge, no growing count.
   */
  function renderIndicator(data, actions) {
    var state = model.reviewState(data);
    if (state !== 'pending' && state !== 'missed') return null;

    return el('button', {
      type: 'button',
      class: 'review-indicator',
      text: state === 'pending' ? 'Review pending' : 'Review missed',
      title: 'Start the weekly review',
      onclick: actions.startReview
    });
  }

  // ------------------------------------------------------------------
  // The review rail
  // ------------------------------------------------------------------

  /**
   * The session holds only the step number. The dataset is passed in at render
   * time rather than captured here, so that importing data while a review is
   * open cannot leave the rail describing a board that no longer exists.
   */
  function createSession(actions) {
    var step = 0;

    function goNext(data) {
      var current = STEPS[step];
      var inboxCount = model.laneCards(data, 'inbox').length;

      if (current.id === 'triage' && inboxCount > 0) {
        ui.confirmDialog({
          title: 'Leave items in Inbox?',
          message: inboxCount + (inboxCount === 1 ? ' item is' : ' items are') +
                   ' still waiting for a decision. You can continue, but the review will not count them as triaged.',
          cancelLabel: 'Keep triaging',
          confirmLabel: 'Continue review'
        }).then(function (yes) {
          if (!yes) return;
          step++;
          actions.rerender();
        });
        return;
      }

      step++;
      actions.rerender();
    }

    function finish(data) {
      var commitmentCount = model.commitments(data).length;
      var title = null;
      var message = null;

      if (commitmentCount === 0) {
        title = 'Finish with no commitments?';
        message = 'Nothing is in In Progress. That may be intentional, but Focus will have no committed work for the week.';
      } else if (commitmentCount > C.FOCUS_COMMITMENTS) {
        title = 'Finish with ' + commitmentCount + ' commitments?';
        message = 'Focus will show only the first ' + C.FOCUS_COMMITMENTS +
                  '. Continue if the rest are intentionally active.';
      }

      if (!title) return actions.finishReview();

      ui.confirmDialog({
        title: title,
        message: message,
        cancelLabel: 'Keep reviewing',
        confirmLabel: 'Finish review'
      }).then(function (yes) { if (yes) actions.finishReview(); });
    }

    function rail(data) {
      var current = STEPS[step];

      return el('section', {
        class: 'rail',
        'aria-labelledby': 'rail-title',
        dataset: { step: current.id }
      }, [
        el('div', { class: 'rail__main' }, [
          el('div', { class: 'rail__text' }, [
            el('p', { class: 'rail__eyebrow' }, [
              el('span', { text: 'Weekly review' }),
              el('span', { class: 'rail__progress', text: (step + 1) + ' of ' + STEPS.length })
            ]),
            el('h2', { class: 'rail__title', id: 'rail-title', text: current.title }),
            el('p', { class: 'rail__guide', text: current.guide })
          ]),
          el('div', { class: 'rail__actions' }, [
            el('button', {
              type: 'button', class: 'btn btn--quiet', text: 'Back',
              disabled: step === 0,
              onclick: function () { step--; actions.rerender(); }
            }),
            step < STEPS.length - 1
              ? el('button', {
                  type: 'button', class: 'btn btn--primary', text: 'Next',
                  'data-autofocus': '',
                  onclick: function () { goNext(data); }
                })
              : el('button', {
                  type: 'button', class: 'btn btn--primary', text: 'Finish review',
                  onclick: function () { finish(data); }
                }),
            el('button', {
              type: 'button', class: 'rail__exit', text: 'Leave review',
              title: 'Leave without recording the review',
              onclick: function () { actions.abandonReview(); }
            })
          ])
        ]),
        current.body ? el('div', { class: 'rail__body' }, [current.body(data, actions)]) : null
      ]);
    }

    return {
      rail: rail,
      stepId: function () { return STEPS[step].id; },
      isLastStep: function () { return step === STEPS.length - 1; }
    };
  }

  // ---- step bodies -------------------------------------------------

  function renderLookBack(data) {
    var since = lastReviewDate(data);
    var done = model.completedSince(data, since);

    if (!done.length) {
      return el('p', { class: 'rail__empty', text: 'Nothing recorded as finished since the last review. That is information too.' });
    }

    return el('div', { class: 'lookback' }, [
      el('ul', { class: 'lookback__list' }, done.slice(0, 20).map(function (card) {
        return el('li', { class: 'lookback__item' }, [
          el('span', { class: 'lookback__title', text: card.title }),
          el('span', { class: 'lookback__when', text: ui.formatShort(card.completedAt) })
        ]);
      })),
      done.length > 20
        ? el('p', { class: 'rail__more', text: '+' + (done.length - 20) + ' more, all kept in your data file.' })
        : null
    ]);
  }

  function renderTriage(data) {
    var left = model.laneCards(data, 'inbox').length;
    return el('p', { class: 'rail__status', text: left === 0
      ? 'Inbox is empty.'
      : left + (left === 1 ? ' item' : ' items') + ' still to file.' });
  }

  function renderPrune(data) {
    var now = new Date();
    var stale = data.cards.filter(function (card) {
      return model.isActive(card) && !card.completedAt &&
             card.lane !== 'inbox' && model.ageDays(card, now) >= PRUNE_AGE_DAYS;
    }).sort(function (a, b) { return model.ageDays(b, now) - model.ageDays(a, now); });

    if (!stale.length) {
      return el('p', { class: 'rail__empty', text: 'Nothing has been sitting longer than ' + PRUNE_AGE_DAYS + ' days.' });
    }

    return el('p', { class: 'rail__status', text:
      stale.length + (stale.length === 1 ? ' card has' : ' cards have') + ' been open ' +
      PRUNE_AGE_DAYS + ' days or more — the oldest is ' + model.ageDays(stale[0], now) +
      ' days. They are marked on the board.' });
  }

  function renderCommit(data) {
    var active = model.commitments(data);

    if (!active.length) {
      return el('p', { class: 'rail__empty', text: 'Nothing in In Progress yet. Drag in the work you want to be true on Friday.' });
    }

    return el('div', { class: 'commit-list' }, [
      el('ol', { class: 'commit-list__items' }, active.map(function (card, i) {
        return el('li', {
          class: 'commit-list__item' + (i < C.FOCUS_COMMITMENTS ? '' : ' commit-list__item--extra'),
          text: card.title
        });
      })),
      active.length > C.FOCUS_COMMITMENTS
        ? el('p', { class: 'rail__more', text: 'Focus will show the first ' + C.FOCUS_COMMITMENTS + '.' })
        : null
    ]);
  }

  /** When the last review happened, or a week ago if there has not been one. */
  function lastReviewDate(data) {
    var done = data.weeklyReviews
      .filter(function (r) { return r.status === 'completed' && r.completedAt; })
      .sort(function (a, b) { return new Date(b.completedAt) - new Date(a.completedAt); });

    if (done.length) return new Date(done[0].completedAt);

    var fallback = new Date();
    fallback.setDate(fallback.getDate() - LOOK_BACK_DAYS);
    return fallback;
  }

  FF.review = {
    renderPrompt: renderPrompt,
    renderIndicator: renderIndicator,
    createSession: createSession,
    PRUNE_AGE_DAYS: PRUNE_AGE_DAYS
  };
})(window.FF);
